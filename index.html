<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blue Zombie: Chronicles of the Hybrid</title>
  <style>
    :root {
      --bg: #06090e;
      --panel: rgba(10, 16, 26, 0.94);
      --border: #1a2a3e;
      --accent: #38bdf8;
      --accent-deep: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --red: #f43f5e;
      --gold: #fbbf24;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      background: #090e15;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      cursor: crosshair;
    }

    /* Cinematic Bars */
    .cinema-bar {
      position: absolute;
      left: 0; right: 0;
      background: #000;
      z-index: 50;
      transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #bar-top { top: 0; height: 0; }
    #bar-bottom { bottom: 0; height: 0; }
    .in-cutscene #bar-top, .in-cutscene #bar-bottom {
      height: 9vh;
    }

    /* Cutscene Dialogue UI */
    #cutscene-ui {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(940px, 94vw);
      background: rgba(8, 14, 24, 0.95);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 22px 28px;
      display: none;
      flex-direction: row;
      gap: 24px;
      align-items: flex-start;
      z-index: 60;
      box-shadow: 0 16px 50px rgba(0,0,0,0.85), 0 0 30px var(--accent-glow);
      backdrop-filter: blur(14px);
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 24px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .speaker-avatar {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      background: #0b121e;
      border: 2px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      margin-top: 4px;
    }
    .dialogue-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .speaker-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .speaker-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .speaker-role-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }
    .dialogue-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dialogue-btn-skip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dialogue-btn-skip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .dialogue-prompt {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 1.2px;
      animation: pulse 1.5s infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .dialogue-text {
      font-size: 16.5px;
      line-height: 1.75;
      letter-spacing: 0.35px;
      color: #f1f5f9;
      min-height: 52px;
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .dialogue-text em {
      color: #94a3b8;
      font-style: italic;
    }
    .dialogue-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 4px;
    }
    .next-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111e30;
      border: 1px solid var(--accent-deep);
      color: var(--accent);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .next-pill:hover {
      background: var(--accent-deep);
      color: #fff;
      transform: translateX(2px);
    }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 30;
      pointer-events: none;
    }
    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hud-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 290px;
    }
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-label {
      font-size: 11px;
      font-weight: 800;
      width: 38px;
      color: var(--text-dim);
    }
    .bar-bg {
      flex: 1;
      height: 10px;
      background: #111a26;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #1f2d3d;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.12s ease-out;
    }
    .bar-hp { background: linear-gradient(90deg, #e11d48, #22c55e); }
    .bar-dash { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    .bar-spin { background: linear-gradient(90deg, #d97706, #fbbf24); }

    .hud-gun-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11.5px;
      font-weight: 700;
      color: #38bdf8;
      cursor: pointer;
    }
    .hud-buffs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 800;
    }
    .buff-tag {
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .buff-fury { background: rgba(240, 185, 79, 0.25); color: #f0b94f; border: 1px solid #f0b94f; }
    .buff-might { background: rgba(183, 116, 255, 0.25); color: #b774ff; border: 1px solid #b774ff; }
    .buff-guard { background: rgba(89, 205, 242, 0.25); color: #59cdf2; border: 1px solid #59cdf2; }
    .buff-haste { background: rgba(110, 230, 142, 0.25); color: #6ee68e; border: 1px solid #6ee68e; }

    .hud-center {
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 24px;
      pointer-events: auto;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .hud-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .hud-buttons {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .icon-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: var(--accent-deep);
      border-color: var(--accent);
    }

    /* Boss HUD */
    #boss-hud {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: min(540px, 86vw);
      background: var(--panel);
      border: 1px solid #e11d48;
      border-radius: 6px;
      padding: 10px 18px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.35);
    }
    .boss-name-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fda4af;
      text-transform: uppercase;
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 12, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: min(860px, 92vw);
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 30px var(--accent-glow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-panel h2 {
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .menu-btn {
      background: #101a27;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background: var(--accent-deep);
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .menu-btn span.badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      font-weight: 600;
    }

    /* Codex entries */
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .codex-card {
      background: #0d1624;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .codex-card.grade-0 { border-color: var(--accent); }
    .codex-card.grade-1 { border-color: #a855f7; }
    .codex-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
    }
    .codex-name { font-size: 15px; font-weight: 700; color: #fff; }
    .codex-desc { font-size: 13px; color: var(--text-dim); line-height: 1.4; }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      display: none;
    }
    .touch-btn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(14, 23, 36, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.5);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 19px;
      pointer-events: auto;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      user-select: none;
    }
    .touch-btn:active {
      transform: scale(0.92);
      border-color: #38bdf8;
    }
    .touch-btn span.btn-lbl {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 1px;
    }
    #btn-slash { bottom: 35px; right: 35px; width: 78px; height: 78px; background: rgba(225, 29, 72, 0.45); border-color: #f43f5e; font-size: 24px; }
    #btn-shoot { bottom: 35px; right: 125px; background: rgba(2, 132, 199, 0.45); border-color: #38bdf8; }
    #btn-dash { bottom: 125px; right: 35px; }
    #btn-spin { bottom: 125px; right: 125px; background: rgba(217, 119, 6, 0.45); border-color: #fbbf24; }
    #btn-cycle { bottom: 205px; right: 80px; }
    #joystick-zone {
      position: absolute;
      bottom: 35px;
      left: 35px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(14, 23, 36, 0.45);
      border: 2px dashed rgba(255,255,255,0.25);
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--accent-deep);
      border: 2px solid var(--accent);
      pointer-events: none;
    }

    /* Notification Banner */
    #banner {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #banner h1 {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      color: #fff;
    }
    #banner p {
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--accent);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Cinematic Overlays -->
    <div id="bar-top" class="cinema-bar"></div>
    <div id="bar-bottom" class="cinema-bar"></div>

    <!-- Cutscene Dialogue Box -->
    <div id="cutscene-ui">
      <div class="speaker-avatar" id="avatar-container">
        <canvas id="avatarCanvas" width="76" height="76"></canvas>
      </div>
      <div class="dialogue-content">
        <div class="dialogue-header">
          <div class="speaker-meta">
            <span class="speaker-name" id="speaker-name">Narrator</span>
            <span class="speaker-role-badge" id="speaker-role">SITUATION REPORT</span>
          </div>
          <div class="dialogue-controls">
            <button class="dialogue-btn-skip" id="btn-skip-cutscene" title="Skip current cutscene">SKIP ❯❯</button>
            <div class="dialogue-prompt">[SPACE / CLICK]</div>
          </div>
        </div>
        <div class="dialogue-text" id="dialogue-text">...</div>
        <div class="dialogue-footer">
          <div class="next-pill" id="btn-next-dialogue">CONTINUE ❯</div>
        </div>
      </div>
    </div>

    <!-- Gameplay Top HUD -->
    <div id="hud">
      <div class="hud-box hud-bars">
        <div class="bar-wrap">
          <div class="bar-label">HP</div>
          <div class="bar-bg"><div id="hp-fill" class="bar-fill bar-hp" style="width: 100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label">DASH</div>
          <div class="bar-bg"><div id="dash-fill" class="bar-fill bar-dash" style="width: 100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label">SPIN</div>
          <div class="bar-bg"><div id="spin-fill" class="bar-fill bar-spin" style="width: 100%"></div></div>
        </div>
        <div class="hud-gun-row" id="hud-gun-info" title="Click or tap to cycle weapons (or press Q / Left Click)">
          <span id="hud-gun-name">GUN: PISTOL (1/1)</span>
          <span id="hud-ammo-count">AMMO: 18</span>
        </div>
        <div class="hud-buffs" id="hud-buffs-list"></div>
      </div>

      <div class="hud-center">
        <div class="hud-title" id="stage-title">PROLOGUE: THE OUTBREAK</div>
        <div class="hud-sub" id="wave-tracker">Threat Level: Grade 5 Horde</div>
      </div>

      <div class="hud-buttons">
        <button class="icon-btn" id="btn-codex">CODEX</button>
        <button class="icon-btn" id="btn-pause">PAUSE</button>
      </div>
    </div>

    <!-- Boss Health Bar -->
    <div id="boss-hud">
      <div class="boss-name-row">
        <span id="boss-title">GRADE 0: THE BLUE ZOMBIE</span>
        <span id="boss-hp-text">100%</span>
      </div>
      <div class="bar-bg" style="height: 12px;">
        <div id="boss-hp-fill" class="bar-fill bar-hp" style="width: 100%"></div>
      </div>
    </div>

    <!-- Mobile Virtual Controls -->
    <div id="mobile-controls">
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <button type="button" class="touch-btn" id="btn-cycle" title="Cycle Gun">🔄<span class="btn-lbl">GUN</span></button>
      <button type="button" class="touch-btn" id="btn-spin" title="Spin Breaker">🌀<span class="btn-lbl">SPIN</span></button>
      <button type="button" class="touch-btn" id="btn-dash" title="Dash">⚡<span class="btn-lbl">DASH</span></button>
      <button type="button" class="touch-btn" id="btn-slash" title="Sword Slash">⚔️<span class="btn-lbl">SLASH</span></button>
      <button type="button" class="touch-btn" id="btn-shoot" title="Fire Gun">🔫<span class="btn-lbl">FIRE</span></button>
    </div>

    <!-- Notification Banner -->
    <div id="banner">
      <h1 id="banner-title">STAGE COMPLETE</h1>
      <p id="banner-sub">PREPARE FOR CONFRONTATION</p>
    </div>

    <!-- Pause / Main Menu Modal -->
    <div id="menu-modal" class="modal-overlay">
      <div class="modal-panel">
        <h2 id="modal-heading">MISSION LOG & SYSTEM</h2>
        <div class="menu-options" id="modal-buttons">
          <button class="menu-btn" id="m-btn-resume">RESUME MISSION <span class="badge">ESC</span></button>
          <button class="menu-btn" id="m-btn-stage1">PLAY CHAPTER 1: THE COLLAPSE <span class="badge">Survive Grade 5</span></button>
          <button class="menu-btn" id="m-btn-stage2">PLAY CHAPTER 2: HYBRID AWAKENING <span class="badge">Supernatural Powers</span></button>
          <button class="menu-btn" id="m-btn-stage3">PLAY CHAPTER 3: DUEL WITH AGENT X <span class="badge">Grade 1 Boss</span></button>
          <button class="menu-btn" id="m-btn-stage4">PLAY CHAPTER 4: CLASH WITH BLUE ZOMBIE <span class="badge">Grade 0 Sovereign</span></button>
          <button class="menu-btn" id="m-btn-sound">AUDIO: SYNTHESIZER SOUND ON</button>
        </div>
      </div>
    </div>

    <!-- Lore Codex Modal -->
    <div id="codex-modal" class="modal-overlay">
      <div class="modal-panel">
        <h2>ZOMBIE HIERARCHY & PERSONNEL DOSSIER</h2>
        <div class="codex-grid" id="codex-content">
          <!-- Filled by JS -->
        </div>
        <button class="icon-btn" id="btn-close-codex" style="align-self: flex-start; padding: 12px 24px; margin-top: 10px;">CLOSE ARCHIVE</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       AUDIO SYNTHESIZER (No external mp3/wav files required, fully zero-lag)
       ===================================================================== */
    const Sound = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, gainVal = 0.2, pitchDrop = 0) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (pitchDrop !== 0) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq - pitchDrop), this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      noise(duration, gainVal = 0.15) {
        if (!this.enabled || !this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * duration;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e) {}
      },
      slash() {
        this.playTone(320, 'triangle', 0.12, 0.25, 180);
        this.noise(0.08, 0.15);
      },
      hit() {
        this.playTone(180, 'sawtooth', 0.15, 0.35, 100);
        this.noise(0.12, 0.2);
      },
      blaster() {
        this.playTone(880, 'sine', 0.18, 0.2, 500);
      },
      dash() {
        this.playTone(400, 'sine', 0.2, 0.15, 250);
      },
      overdrive() {
        this.playTone(220, 'sawtooth', 0.4, 0.3, -400);
        this.playTone(440, 'triangle', 0.5, 0.3, -200);
      },
      beep(pitch = 500) {
        this.playTone(pitch, 'sine', 0.04, 0.06);
      },
      bossShockwave() {
        this.playTone(90, 'sawtooth', 0.6, 0.5, 50);
        this.noise(0.4, 0.35);
      }
    };

      playCutscene(scriptArray, onFinish) {
        this.state = 'STORY';
        this.script = scriptArray;
        this.scriptIndex = 0;
        this.onCutsceneFinish = onFinish;
        document.body.classList.add('in-cutscene');
        const cutsceneBox = document.getElementById('cutscene-ui');
        cutsceneBox.style.display = 'flex';
        
        // Setup interactive button events
        document.getElementById('btn-skip-cutscene').onclick = (e) => {
          e.stopPropagation();
          this.endCutscene();
        };
        document.getElementById('btn-next-dialogue').onclick = (e) => {
          e.stopPropagation();
          this.advanceDialogue();
        };
        cutsceneBox.onclick = () => {
          this.advanceDialogue();
        };

        this.showDialogueLine();
      },

      showDialogueLine() {
        if (this.scriptIndex >= this.script.length) {
          this.endCutscene();
          return;
        }
        const item = this.script[this.scriptIndex];
        const speakerEl = document.getElementById('speaker-name');
        const roleEl = document.getElementById('speaker-role');
        const cutsceneBox = document.getElementById('cutscene-ui');

        speakerEl.innerText = item.speaker;
        speakerEl.style.color = item.theme || '#38bdf8';
        roleEl.innerText = item.role || 'COMMUNICATION';
        roleEl.style.color = item.theme || '#38bdf8';
        roleEl.style.borderColor = (item.theme || '#38bdf8') + '55';
        roleEl.style.backgroundColor = (item.theme || '#38bdf8') + '1a';
        cutsceneBox.style.borderLeftColor = item.theme || '#38bdf8';
        cutsceneBox.style.boxShadow = `0 16px 50px rgba(0,0,0,0.85), 0 0 30px ${item.theme || '#38bdf8'}33`;

        this.renderAvatar(item.speaker, item.theme);
        
        const textEl = document.getElementById('dialogue-text');
        textEl.innerText = "";
        this.dialogueTextTarget = item.text;
        this.charIndex = 0;

        if (this.dialogueTimer) clearInterval(this.dialogueTimer);
        this.dialogueTimer = setInterval(() => {
          if (this.charIndex < this.dialogueTextTarget.length) {
            textEl.innerText += this.dialogueTextTarget[this.charIndex];
            if (this.charIndex % 3 === 0) {
              const pitch = item.speaker.includes('BLUE ZOMBIE') ? 220 : (item.speaker.includes('AGENT X') ? 360 : (item.speaker.includes('VANCE') ? 440 : 540));
              Sound.beep(pitch);
            }
            this.charIndex++;
          } else {
            clearInterval(this.dialogueTimer);
          }
        }, 20);
      },

      advanceDialogue() {
        if (this.charIndex < this.dialogueTextTarget.length) {
          // Instant complete line
          clearInterval(this.dialogueTimer);
          document.getElementById('dialogue-text').innerText = this.dialogueTextTarget;
          this.charIndex = this.dialogueTextTarget.length;
        } else {
          this.scriptIndex++;
          this.showDialogueLine();
        }
      },

      endCutscene() {
        if (this.dialogueTimer) clearInterval(this.dialogueTimer);
        document.body.classList.remove('in-cutscene');
        document.getElementById('cutscene-ui').style.display = 'none';
        if (this.onCutsceneFinish) {
          const fn = this.onCutsceneFinish;
          this.onCutsceneFinish = null;
          fn();
        }

          avCtx.strokeRect(1, 1, 74, 74);
        } else {
          // Narrator / Terminal
          avCtx.fillStyle = '#94a3b8';
          avCtx.font = "32px monospace";
          avCtx.textAlign = "center";
          avCtx.textBaseline = "middle";
          avCtx.fillText("◈", 38, 38);
          avCtx.strokeStyle = '#334155';
          avCtx.lineWidth = 3;
          avCtx.strokeRect(1, 1, 74, 74);
        }
      },

      spawnHorde(count, maxGrade = 5) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            if (this.state !== 'PLAYING') return;
            const angle = Math.random() * Math.PI * 2;
            const dist = 550 + Math.random() * 200;
            const x = Player.x + Math.cos(angle) * dist;
            const y = Player.y + Math.sin(angle) * dist;
            let grade = 5;
            if (maxGrade <= 4 && Math.random() > 0.45) grade = 4;
            if (maxGrade <= 3 && Math.random() > 0.7) grade = 3;
            Enemies.spawn(x, y, grade);
          }, i * 350);
        }
      },

      onEnemyDefeated(enemy) {
        this.enemiesKilled++;

        // Loot drops (zombie-night logic)
        if (!Player.starterGunDropped) {
          Pickups.drop(enemy.x, enemy.y, false, 'gun');
          Player.starterGunDropped = true;
        } else if (Player.currentGun && Player.gunAmmo <= 6) {
          Pickups.drop(enemy.x, enemy.y, false, 'ammo');
        } else if (Math.random() < 0.35) {
          Pickups.drop(enemy.x, enemy.y, false);
        }

        if (this.currentChapter === 1) {
          document.getElementById('wave-tracker').innerText = `Defeated: ${this.enemiesKilled} / ${this.quotaKilled}`;
          if (this.enemiesKilled >= this.quotaKilled) {
            // Trigger Chapter 1 climax cutscene (Blue Zombie arrives and spares boy due to ego)
            this.state = 'STORY';
            Enemies.list = [];
            this.playCutscene(STORY_FLOW.blueZombieFirstEncounter, () => {
              // Transition to Chapter 2
              this.loadChapter(2);
            });
          }
        } else if (this.currentChapter === 2) {
          document.getElementById('wave-tracker').innerText = `Haven Defense: ${this.enemiesKilled} / ${this.quotaKilled}`;
          if (this.enemiesKilled >= this.quotaKilled) {
            // Trigger Chapter 3 (Agent X arrives)
            this.loadChapter(3);
          }
        }
      },

      onBossDefeated(bossName) {
        if (bossName === 'AGENT_X') {
          // Trigger Chapter 4 (Blue Zombie arrives for final clash)
          this.loadChapter(4);
        } else if (bossName === 'BLUE_ZOMBIE') {
          // Trigger Ending Cutscene!
          this.playCutscene(STORY_FLOW.ending, () => {
            this.showBanner("WAR FOR TOMORROW", "CHAPTER COMPLETE - SAVED PROGRESS");
          });
        }
      },

      showBanner(title, sub) {
        const b = document.getElementById('banner');
        document.getElementById('banner-title').innerText = title;
        document.getElementById('banner-sub').innerText = sub;
        b.style.display = 'block';
        setTimeout(() => { b.style.display = 'none'; }, 4000);
      }
    };

    /* =====================================================================
       GUNS DEFINITION (exact zombie-night specs)
       ===================================================================== */
    const GUNS = {
      pistol:     { name: 'PISTOL',       dmg: 48,  range: 370, cooldown: 20, pellets: 1, spread: 0.035, ammo: 18, color: '#fbbf24' },
      shotgun:    { name: 'SHOTGUN',      dmg: 23,  range: 220, cooldown: 43, pellets: 5, spread: 0.25,  ammo: 10, color: '#f97316' },
      rifle:      { name: 'RIFLE',        dmg: 74,  range: 500, cooldown: 11, pellets: 1, spread: 0.02,  ammo: 28, color: '#34d399' },
      machinegun: { name: 'MACHINE GUN',  dmg: 25,  range: 410, cooldown:  5, pellets: 1, spread: 0.11,  ammo: 45, color: '#f87171' }
    };
    const GUN_ORDER = ['pistol', 'shotgun', 'rifle', 'machinegun'];

    /* =====================================================================
       PICKUPS / LOOT DROPS
       ===================================================================== */
    const Pickups = {
      list: [],
      drop(x, y, isBoss = false, forcedType = null) {
        const pool = ['med', 'fury', 'might', 'guard', 'haste', 'ammo', 'gun'];
        let type = forcedType || pool[Math.floor(Math.random() * pool.length)];
        let gunKey = null;
        if (type === 'gun') {
          const available = GUN_ORDER.filter(k => !Player.arsenal.includes(k));
          if (available.length === 0) { type = 'ammo'; } else {
            gunKey = available[Math.floor(Math.random() * available.length)];
          }
        }
        this.list.push({ x, y, type, gunKey, life: 420, spin: 0 });
        if (isBoss) {
          // bonus drop
          const bonusPool = ['fury', 'might', 'guard', 'haste'];
          this.list.push({ x: x + 28, y, type: bonusPool[Math.floor(Math.random() * bonusPool.length)], gunKey: null, life: 420, spin: 0 });
        }
      },
      collect(drop) {
        const labels = { med:'MED KIT', fury:'FURY', might:'MIGHT', guard:'GUARD', haste:'HASTE', ammo:'AMMO', gun:'NEW GUN' };
        switch(drop.type) {
          case 'med':
            Player.hp = Math.min(Player.maxHp, Player.hp + 28);
            Game.showBanner('MED KIT', '+28 HP');
            break;
          case 'fury':
            Player.furyTimer = 420; // 7s
            Game.showBanner('FURY', 'FAST SLASHES');
            break;
          case 'might':
            Player.mightTimer = 540; // 9s
            Game.showBanner('MIGHT', '+65% DAMAGE');
            break;
          case 'guard':
            Player.guardTimer = 540;
            Game.showBanner('GUARD', '58% LESS DAMAGE');
            break;
          case 'haste':
            Player.hasteTimer = 540;
            Game.showBanner('HASTE', '+28% SPEED');
            break;
          case 'ammo':
            if (Player.currentGun) {
              const add = 8 + Math.floor(Math.random() * 11);
              Player.gunAmmo = Math.min(GUNS[Player.currentGun].ammo * 2, Player.gunAmmo + add);
            }
            break;
          case 'gun':
            if (drop.gunKey && !Player.arsenal.includes(drop.gunKey)) {
              Player.arsenal.push(drop.gunKey);
              if (!Player.currentGun) { Player.currentGun = drop.gunKey; Player.gunAmmo = GUNS[drop.gunKey].ammo; Player.gunCooldown = 0; }
              Game.showBanner('NEW GUN', GUNS[drop.gunKey].name + ' ACQUIRED');
            }
            break;
        }
        Sound.hit();
        Player.updateHUD();
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const d = this.list[i];
          d.life--;
          d.spin += 0.04;
          // Collect if player overlaps
          if (Math.hypot(Player.x - d.x, Player.y - d.y) < Player.radius + 18) {
            this.collect(d);
            this.list.splice(i, 1);
            continue;
          }
          if (d.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        const colorMap = { med:'#22c55e', fury:'#f59e0b', might:'#ef4444', guard:'#3b82f6', haste:'#a855f7', ammo:'#94a3b8', gun:'#fbbf24' };
        const iconMap  = { med:'➕', fury:'⚡', might:'💥', guard:'🛡', haste:'💨', ammo:'🔹', gun:'🔫' };
        for (let d of this.list) {
          const alpha = Math.min(1, d.life / 60);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(d.x, d.y);
          ctx.rotate(d.spin);
          ctx.shadowColor = colorMap[d.type];
          ctx.shadowBlur = 14;
          ctx.strokeStyle = colorMap[d.type];
          ctx.lineWidth = 2.5;
          ctx.strokeRect(-14, -14, 28, 28);
          ctx.fillStyle = 'rgba(9,14,21,0.72)';
          ctx.fillRect(-14, -14, 28, 28);
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '15px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(iconMap[d.type], d.x, d.y);
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       PLAYER (Boy / Transformed Hybrid) — zombie-night compatible
       ===================================================================== */
    const Player = {
      x: 0,
      y: 0,
      radius: 18,
      speed: 4.8,
      hp: 100,
      maxHp: 100,
      isHybrid: false,
      angle: 0,

      // Sword combo
      comboStep: 0,
      comboTimer: 0,
      attackCooldown: 0,

      // Dash
      isDashing: false,
      dashFrames: 0,
      dashCooldown: 0,
      dashDirX: 0,
      dashDirY: 0,

      // Spin-Breaker
      spinCooldown: 0,

      // Buffs (frame counters)
      furyTimer: 0,
      mightTimer: 0,
      guardTimer: 0,
      hasteTimer: 0,

      // Gun system
      currentGun: null,
      arsenal: [],
      gunIndex: 0,
      gunAmmo: 0,
      gunCooldown: 0,

      // Loot state
      starterGunDropped: false,

      resetForChapter(ch) {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.hp = 100;
        this.isHybrid = ch >= 2;
        this.speed = this.isHybrid ? 5.8 : 4.5;
        this.isDashing = false; this.dashFrames = 0; this.dashCooldown = 0;
        this.spinCooldown = 0;
        this.comboStep = 0; this.comboTimer = 0; this.attackCooldown = 0;
        this.furyTimer = 0; this.mightTimer = 0; this.guardTimer = 0; this.hasteTimer = 0;
        this.currentGun = null; this.arsenal = []; this.gunIndex = 0; this.gunAmmo = 0; this.gunCooldown = 0;
        this.starterGunDropped = false;
        Pickups.list = [];
        this.updateHUD();
      },

      update() {
        if (Game.state !== 'PLAYING') return;

        // Buff timers
        if (this.furyTimer > 0) this.furyTimer--;
        if (this.mightTimer > 0) this.mightTimer--;
        if (this.guardTimer > 0) this.guardTimer--;
        if (this.hasteTimer > 0) this.hasteTimer--;

        // Cooldowns
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.spinCooldown > 0) this.spinCooldown--;
        if (this.gunCooldown > 0) this.gunCooldown--;

        // Combo reset
        if (this.comboTimer > 0) { this.comboTimer--; if (this.comboTimer <= 0) this.comboStep = 0; }

        // Dashing
        if (this.isDashing) {
          this.x += this.dashDirX * 13;
          this.y += this.dashDirY * 13;
          this.dashFrames--;
          Particles.spawnDashGhost(this.x, this.y, this.angle, this.isHybrid);
          if (this.dashFrames <= 0) this.isDashing = false;
          this.clamp();
          return;
        }

        // Auto-fire when Shift held
        if ((Input.keys['Shift'] || Input.keys['ShiftLeft'] || Input.keys['ShiftRight']) && Game.state === 'PLAYING') {
          this.fireGun();
        }

        // Movement
        let dx = 0, dy = 0;
        if (Input.keys['w'] || Input.keys['W'] || Input.keys['ArrowUp']) dy -= 1;
        if (Input.keys['s'] || Input.keys['S'] || Input.keys['ArrowDown']) dy += 1;
        if (Input.keys['a'] || Input.keys['A'] || Input.keys['ArrowLeft']) dx -= 1;
        if (Input.keys['d'] || Input.keys['D'] || Input.keys['ArrowRight']) dx += 1;
        if (Input.joystick.active) { dx = Input.joystick.x; dy = Input.joystick.y; }

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy);
          let spd = this.speed * (this.hasteTimer > 0 ? 1.28 : 1);
          this.x += (dx / len) * spd;
          this.y += (dy / len) * spd;
        }

        // Auto-aim: lock to nearest enemy within 300px, else mouse
        let aimX = Input.mouseX, aimY = Input.mouseY;
        let nearest = null, nearDist = 300;
        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < nearDist) { nearDist = d; nearest = e; }
        }
        if (Boss.active) {
          const bd = Math.hypot(Boss.x - this.x, Boss.y - this.y);
          if (bd < nearDist) { nearest = Boss; }
        }
        if (nearest) { aimX = nearest.x; aimY = nearest.y; }
        this.angle = Math.atan2(aimY - this.y, aimX - this.x);

        this.clamp();
        this.updateHUD();
      },

      clamp() {
        const pad = 30;
        this.x = Math.max(pad, Math.min(canvas.width - pad, this.x));
        this.y = Math.max(pad, Math.min(canvas.height - pad, this.y));
      },

      attack() {
        if (this.attackCooldown > 0) return;
        const cd = this.furyTimer > 0 ? 8 : 14;
        this.comboStep = (this.comboStep % 3) + 1;
        this.comboTimer = 35;
        this.attackCooldown = cd;
        Sound.slash();
        Game.shake = 4;

        const range = this.isHybrid ? 78 : 55;
        const arc = Math.PI * 0.7;
        let dmg = (this.isHybrid ? 42 : 25);
        if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);

        for (let e of Enemies.list) {
          const dist = Math.hypot(e.x - this.x, e.y - this.y);
          if (dist < range + e.radius) {
            const angleTo = Math.atan2(e.y - this.y, e.x - this.x);
            let diff = Math.abs(angleTo - this.angle);
            while (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < arc / 2) e.takeDamage(dmg, Math.cos(this.angle) * 8, Math.sin(this.angle) * 8);
          }
        }
        if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < range + Boss.radius) Boss.takeDamage(dmg);
        Particles.spawnSlashArc(this.x, this.y, this.angle, range, this.isHybrid, this.comboStep);
      },

      fireGun() {
        if (!this.currentGun || this.gunAmmo <= 0 || this.gunCooldown > 0) return;
        const g = GUNS[this.currentGun];
        this.gunCooldown = g.cooldown;
        this.gunAmmo--;
        Sound.blaster();
        Game.shake = 2;

        for (let i = 0; i < g.pellets; i++) {
          const spread = (Math.random() - 0.5) * g.spread;
          const ang = this.angle + spread;
          const spd = g.range / 35;
          const life = Math.floor(g.range / spd);
          let dmg = g.dmg;
          if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);
          this.spawnPlayerBullet(this.x, this.y, ang, spd, dmg, life);
        }
        this.updateHUD();
      },

      spawnPlayerBullet(x, y, angle, speed, dmg, life) {
        Projectiles.list.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          dmg, type: 'BULLET', life, maxLife: life, angle, isPlayer: true
        });
      },

      spinBreaker() {
        if (this.spinCooldown > 0) return;
        this.spinCooldown = 264; // 4.4s
        Sound.overdrive();
        Game.shake = 14;
        Game.flashAlpha = 0.5;
        Game.flashColor = '#38bdf8';

        const range = this.isHybrid ? 220 : 160;
        let dmg = this.isHybrid ? 110 : 70;
        if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);

        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < range) {
            const ang = Math.atan2(e.y - this.y, e.x - this.x);
            e.takeDamage(dmg, Math.cos(ang) * 12, Math.sin(ang) * 12);
          }
        }
        if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < range) Boss.takeDamage(dmg);
        Particles.spawnShockwave(this.x, this.y, this.isHybrid ? '#38bdf8' : '#94a3b8', range);
      },

      dash() {
        if (this.isDashing || this.dashCooldown > 0) return;
        this.isDashing = true;
        this.dashFrames = 9;
        this.dashCooldown = 66; // ~1.1s
        Sound.dash();

        let dx = 0, dy = 0;
        if (Input.keys['w'] || Input.keys['W'] || Input.keys['ArrowUp']) dy -= 1;
        if (Input.keys['s'] || Input.keys['S'] || Input.keys['ArrowDown']) dy += 1;
        if (Input.keys['a'] || Input.keys['A'] || Input.keys['ArrowLeft']) dx -= 1;
        if (Input.keys['d'] || Input.keys['D'] || Input.keys['ArrowRight']) dx += 1;
        if (Input.joystick.active) { dx = Input.joystick.x; dy = Input.joystick.y; }
        if (dx === 0 && dy === 0) { dx = Math.cos(this.angle); dy = Math.sin(this.angle); }
        const len = Math.hypot(dx, dy);
        this.dashDirX = dx / len;
        this.dashDirY = dy / len;
      },

      cycleWeapon() {
        if (this.arsenal.length < 2) return;
        this.gunIndex = (this.gunIndex + 1) % this.arsenal.length;
        this.currentGun = this.arsenal[this.gunIndex];
        this.gunAmmo = GUNS[this.currentGun].ammo;
        this.gunCooldown = 0;
        Sound.dash();
        this.updateHUD();
      },

      takeDamage(amount) {
        if (this.isDashing) return;
        let dmg = this.guardTimer > 0 ? Math.floor(amount * 0.42) : amount;
        this.hp -= dmg;
        Sound.hit();
        Game.shake = 8;
        Game.flashAlpha = 0.3;
        Game.flashColor = '#e11d48';
        if (this.hp <= 0) {
          this.hp = 0;
          Game.showBanner("CRITICAL INJURY", "RETRYING MISSION...");
          setTimeout(() => { Game.loadChapter(Game.currentChapter); }, 1500);
        }
      },

      // kept for backward-compat with overdrive calls (no-op now)
      addOverdrive() {},

      updateHUD() {
        document.getElementById('hp-fill').style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;

        // DASH bar: 0 = cooling down, 100 = ready
        const dashPct = this.dashCooldown > 0 ? Math.max(0, (1 - this.dashCooldown / 66) * 100) : 100;
        document.getElementById('dash-fill').style.width = `${dashPct}%`;

        // SPIN bar
        const spinPct = this.spinCooldown > 0 ? Math.max(0, (1 - this.spinCooldown / 264) * 100) : 100;
        document.getElementById('spin-fill').style.width = `${spinPct}%`;

        // Gun row
        if (this.currentGun) {
          const g = GUNS[this.currentGun];
          document.getElementById('hud-gun-name').innerText = `GUN: ${g.name} (${this.gunIndex + 1}/${this.arsenal.length})`;
          document.getElementById('hud-ammo-count').innerText = `AMMO: ${this.gunAmmo}`;
          document.getElementById('hud-gun-info').style.display = 'flex';
        } else {
          document.getElementById('hud-gun-info').style.display = 'none';
        }

        // Buff tags
        const bl = document.getElementById('hud-buffs-list');
        let html = '';
        if (this.furyTimer  > 0) html += `<span class="buff-tag buff-fury">FURY ${Math.ceil(this.furyTimer/60)}s</span>`;
        if (this.mightTimer > 0) html += `<span class="buff-tag buff-might">MIGHT ${Math.ceil(this.mightTimer/60)}s</span>`;
        if (this.guardTimer > 0) html += `<span class="buff-tag buff-guard">GUARD ${Math.ceil(this.guardTimer/60)}s</span>`;
        if (this.hasteTimer > 0) html += `<span class="buff-tag buff-haste">HASTE ${Math.ceil(this.hasteTimer/60)}s</span>`;
        bl.innerHTML = html;
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isHybrid) {
          const auraGlow = this.spinCooldown === 0 ? 30 : 15;
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = auraGlow;
          ctx.fill();
        }

        ctx.rotate(this.angle);

        ctx.fillStyle = this.isHybrid ? '#0284c7' : '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = this.isHybrid ? '#38bdf8' : '#64748b';
        ctx.stroke();

        if (this.isHybrid) {
          ctx.strokeStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 12;
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(12, 10); ctx.lineTo(36, 14); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(12, -10); ctx.lineTo(32, -12); ctx.stroke();
        } else {
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(28, 12); ctx.stroke();
        }

        ctx.fillStyle = this.isHybrid ? '#ffffff' : '#000000';
        ctx.shadowBlur = this.isHybrid ? 8 : 0;
        ctx.beginPath();
        ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
        ctx.arc(8, 5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    };

    /* =====================================================================
       ENEMIES (Grades 5, 4, 3)
       ===================================================================== */
    const Enemies = {
      list: [],
      spawn(x, y, grade = 5) {
        let hp = 40, speed = 2.2, radius = 16, color = '#22c55e', stroke = '#15803d';
        if (grade === 4) { // Stalker
          hp = 70; speed = 3.4; radius = 17; color = '#eab308'; stroke = '#ca8a04';
        } else if (grade === 3) { // Armed Apex Predator
          hp = 140; speed = 2.0; radius = 22; color = '#f97316'; stroke = '#c2410c';
        }
        this.list.push({
          x, y, grade, hp, maxHp: hp, speed, radius, color, stroke,
          vx: 0, vy: 0,
          attackTimer: 0,
          takeDamage(dmg, kx = 0, ky = 0) {
            this.hp -= dmg;
            this.vx += kx;
            this.vy += ky;
            Sound.hit();
            Particles.spawnBlood(this.x, this.y, this.color);
            if (this.hp <= 0) {
              this.isDead = true;
              Game.onEnemyDefeated(this);
            }
          }
        });
      },

      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const e = this.list[i];
          if (e.isDead) {
            this.list.splice(i, 1);
            continue;
          }

          // Knockback decay
          e.x += e.vx; e.y += e.vy;
          e.vx *= 0.85; e.vy *= 0.85;

          // AI Tracking
          const dx = Player.x - e.x;
          const dy = Player.y - e.y;
          const dist = Math.hypot(dx, dy);

          if (dist > e.radius + Player.radius) {
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;
          } else {
            // Attack player
            e.attackTimer++;
            if (e.attackTimer > 35) {
              e.attackTimer = 0;
              const dmg = e.grade === 3 ? 22 : (e.grade === 4 ? 14 : 9);
              Player.takeDamage(dmg);
            }
          }

          // Zombie-zombie collision avoidance
          for (let j = 0; j < this.list.length; j++) {
            if (i === j) continue;
            const o = this.list[j];
            const d = Math.hypot(o.x - e.x, o.y - e.y);
            if (d < e.radius + o.radius) {
              const push = (e.radius + o.radius - d) * 0.2;
              const ang = Math.atan2(e.y - o.y, e.x - o.x);
              e.x += Math.cos(ang) * push;
              e.y += Math.sin(ang) * push;
            }
          }
        }
      },

      draw() {
        for (let e of this.list) {
          ctx.save();
          ctx.translate(e.x, e.y);
          const ang = Math.atan2(Player.y - e.y, Player.x - e.x);
          ctx.rotate(ang);

          // Body
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = e.stroke;
          ctx.stroke();

          // Claws / Weapons
          if (e.grade === 3) {
            // Cleaver / Axe
            ctx.fillStyle = '#64748b';
            ctx.fillRect(10, 6, 16, 6);
          } else {
            // Claws
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(8, 8); ctx.lineTo(16, 11);
            ctx.moveTo(8, -8); ctx.lineTo(16, -11);
            ctx.stroke();
          }

          // Health bar above head
          ctx.restore();
          if (e.hp < e.maxHp) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(e.x - 16, e.y - e.radius - 10, 32, 5);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(e.x - 16, e.y - e.radius - 10, (e.hp / e.maxHp) * 32, 5);
          }
        }
      }
    };

    /* =====================================================================
       BOSS SYSTEM (Agent X & Blue Zombie)
       ===================================================================== */
    const Boss = {
      active: false,
      type: '', // 'AGENT_X' or 'BLUE_ZOMBIE'
      x: 0, y: 0,
      radius: 26,
      hp: 1000,
      maxHp: 1000,
      phase: 1,
      attackTimer: 0,
      angle: 0,
      state: 'IDLE',
      teleportTimer: 0,

      spawnAgentX() {
        this.active = true;
        this.type = 'AGENT_X';
        this.x = canvas.width / 2;
        this.y = 140;
        this.hp = 850;
        this.maxHp = 850;
        this.radius = 24;
        this.showHUD("GRADE 1: AGENT X (ARISTOCRAT)");
      },

      spawnBlueZombie() {
        this.active = true;
        this.type = 'BLUE_ZOMBIE';
        this.x = canvas.width / 2;
        this.y = 140;
        this.hp = 1400;
        this.maxHp = 1400;
        this.radius = 28;
        this.showHUD("GRADE 0: THE BLUE ZOMBIE (SOVEREIGN)");
      },

      showHUD(title) {
        document.getElementById('boss-title').innerText = title;
        document.getElementById('boss-hud').style.display = 'flex';
        this.updateHUD();
      },

      updateHUD() {
        const pct = Math.max(0, (this.hp / this.maxHp) * 100);
        document.getElementById('boss-hp-fill').style.width = `${pct}%`;
        document.getElementById('boss-hp-text').innerText = `${Math.ceil(pct)}%`;
      },

      takeDamage(dmg) {
        if (!this.active) return;
        this.hp -= dmg;
        Sound.hit();
        Particles.spawnBlood(this.x, this.y, this.type === 'BLUE_ZOMBIE' ? '#38bdf8' : '#881337');
        this.updateHUD();

        if (this.hp <= 0) {
          this.active = false;
          document.getElementById('boss-hud').style.display = 'none';
          // Boss loot drops
          Pickups.drop(this.x - 18, this.y, true, 'gun');
          Pickups.drop(this.x + 18, this.y, true);
          Game.onBossDefeated(this.type);
        }
      },

      update() {
        if (!this.active || Game.state !== 'PLAYING') return;

        this.angle = Math.atan2(Player.y - this.y, Player.x - this.x);
        this.attackTimer++;

        if (this.type === 'AGENT_X') {
          // AGENT X: Swift Rapier Lunges & Burgundy Shadow Teleports
          const dist = Math.hypot(Player.x - this.x, Player.y - this.y);
          if (dist > 90) {
            this.x += Math.cos(this.angle) * 3.8;
            this.y += Math.sin(this.angle) * 3.8;
          }

          if (this.attackTimer % 90 === 0) {
            // Rapier Lunge Combo
            Sound.slash();
            Projectiles.spawn(this.x, this.y, this.angle, 14, 25, 'SHADOW_BLADE');
          }

          if (this.attackTimer % 210 === 0) {
            // Shadow Teleport behind player
            Sound.dash();
            Particles.spawnShadowVortex(this.x, this.y);
            const ang = Player.angle + Math.PI;
            this.x = Player.x + Math.cos(ang) * 90;
            this.y = Player.y + Math.sin(ang) * 90;
            Particles.spawnShadowVortex(this.x, this.y);
          }
        } else if (this.type === 'BLUE_ZOMBIE') {
          // BLUE ZOMBIE: Telekinetic Gravity, Azure Shockwaves, Dimensional Pulses
          const dist = Math.hypot(Player.x - this.x, Player.y - this.y);
          this.x += Math.cos(this.angle) * 2.2;
          this.y += Math.sin(this.angle) * 2.2;

          // Azure Shockwave Pulse
          if (this.attackTimer % 110 === 0) {
            Sound.bossShockwave();
            Game.shake = 12;
            Particles.spawnShockwave(this.x, this.y, '#38bdf8', 220);
            if (dist < 220) {
              Player.takeDamage(26);
            }
          }

          // Telekinetic Azure Projectile Ring
          if (this.attackTimer % 180 === 0) {
            Sound.blaster();
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
              Projectiles.spawn(this.x, this.y, a, 8, 30, 'AZURE_ORB');
            }
          }

          // Gravitational Drag
          if (dist > 180 && this.attackTimer % 260 === 0) {
            Player.x += (this.x - Player.x) * 0.35;
            Player.y += (this.y - Player.y) * 0.35;
            Game.flashAlpha = 0.25;
            Game.flashColor = '#0284c7';
            Sound.bossShockwave();
          }
        }
      },

      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.type === 'BLUE_ZOMBIE') {
          // CANONICAL BLUE ZOMBIE: Human-shaped, blue skin, ordinary gray T-shirt, black pants
          // Azure telekinetic aura
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 24;
          ctx.fill();

          // Gray T-shirt torso
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#38bdf8';
          ctx.stroke();

          // Pale Blue Head / Hands
          ctx.fillStyle = '#22d3ee';
          ctx.beginPath();
          ctx.arc(8, 0, 10, 0, Math.PI * 2);
          ctx.fill();

          // Cold Cyan Glowing Eyes
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.fillRect(12, -4, 4, 3);
          ctx.fillRect(12, 2, 4, 3);
        } else if (this.type === 'AGENT_X') {
          // CANONICAL AGENT X: Pale human male, dark hair, black coat, white shirt, burgundy vest
          // Burgundy shadow aura
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(168, 85, 247, 0.2)';
          ctx.shadowColor = '#9333ea';
          ctx.shadowBlur = 18;
          ctx.fill();

          // Black coat & burgundy vest
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#881337'; // burgundy vest
          ctx.fillRect(-6, -8, 12, 16);

          // Head & slick dark hair
          ctx.fillStyle = '#ffe4e6'; // pale face
          ctx.beginPath();
          ctx.arc(8, 0, 9, 0, Math.PI * 2);
          ctx.fill();

          // Rapier Cane Blade
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(12, 8);
          ctx.lineTo(38, 12);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    /* =====================================================================
       PROJECTILES
       ===================================================================== */
    const Projectiles = {
      list: [],
      spawn(x, y, angle, speed, dmg, type) {
        this.list.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          dmg, type, life: 75, angle
        });
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const p = this.list[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          // Collisions
          if (p.type === 'BULLET' || p.type === 'HYBRID_BLASTER' || p.isPlayer) {
            // Hit Enemies
            for (let e of Enemies.list) {
              if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 8) {
                e.takeDamage(p.dmg, p.vx * 0.4, p.vy * 0.4);
                p.life = 0;
                break;
              }
            }
            // Hit Boss
            if (Boss.active && Math.hypot(Boss.x - p.x, Boss.y - p.y) < Boss.radius + 8) {
              Boss.takeDamage(p.dmg);
              p.life = 0;
            }
          } else {
            // Enemy / Boss Projectile hitting player
            if (Math.hypot(Player.x - p.x, Player.y - p.y) < Player.radius + 8) {
              Player.takeDamage(p.dmg);
              p.life = 0;
            }
          }

          if (p.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        for (let p of this.list) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);

          if (p.type === 'HYBRID_BLASTER') {
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.fillRect(-10, -3, 20, 6);
          } else if (p.type === 'AZURE_ORB') {
            ctx.fillStyle = '#06b6d4';
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'SHADOW_BLADE') {
            ctx.fillStyle = '#9333ea';
            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 12;
            ctx.fillRect(-8, -2, 16, 4);
          } else {
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-6, -2, 12, 4);
          }
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       PARTICLES & VFX
       ===================================================================== */
    const Particles = {
      list: [],
      spawnBlood(x, y, color = '#ef4444') {
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 4;
          this.list.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 25, maxLife: 25, size: 3 + Math.random() * 3, color
          });
        }
      },
      spawnSlashArc(x, y, angle, range, isHybrid, comboStep) {
        this.list.push({
          type: 'SLASH_ARC', x, y, angle, range, isHybrid,
          comboStep, life: 9, maxLife: 9
        });
      },
      spawnDashGhost(x, y, angle, isHybrid) {
        this.list.push({
          type: 'GHOST', x, y, angle, isHybrid,
          life: 14, maxLife: 14
        });
      },
      spawnShockwave(x, y, color, maxRadius) {
        this.list.push({
          type: 'WAVE', x, y, color, currentRadius: 10, maxRadius,
          life: 20, maxLife: 20
        });
      },
      spawnShadowVortex(x, y) {
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * Math.PI * 2;
          this.list.push({
            x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
            life: 20, maxLife: 20, size: 4, color: '#881337'
          });
        }
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const p = this.list[i];
          p.life--;
          if (p.vx !== undefined) {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.92; p.vy *= 0.92;
          }
          if (p.type === 'WAVE') {
            p.currentRadius += (p.maxRadius - p.currentRadius) * 0.18;
          }
          if (p.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        for (let p of this.list) {
          const alpha = p.life / p.maxLife;
          ctx.save();
          if (p.type === 'SLASH_ARC') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.strokeStyle = p.isHybrid ? `rgba(56, 189, 248, ${alpha})` : `rgba(241, 245, 249, ${alpha})`;
            ctx.shadowColor = p.isHybrid ? '#38bdf8' : '#ffffff';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, p.range, -0.4, 0.4);
            ctx.stroke();
          } else if (p.type === 'GHOST') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.isHybrid ? `rgba(56, 189, 248, ${alpha * 0.3})` : `rgba(148, 163, 184, ${alpha * 0.25})`;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'WAVE') {
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.currentRadius, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       INPUT HANDLER (Keyboard + Mouse + Mobile Virtual Controls)
       ===================================================================== */
    const Input = {
      keys: {},
      mouseX: window.innerWidth / 2,
      mouseY: window.innerHeight / 2,
      joystick: { active: false, x: 0, y: 0, startX: 0, startY: 0 },

      init() {
        window.addEventListener('keydown', e => {
          this.keys[e.key] = true;

          if (Game.state === 'STORY') {
            if (e.key === ' ' || e.key === 'Enter') { Game.advanceDialogue(); e.preventDefault(); }
            return;
          }

          // Gameplay controls
          if (e.key === 'Enter') Player.attack();
          if (e.key === ' ') { Player.dash(); e.preventDefault(); }
          if (e.key === 'e' || e.key === 'E') Player.spinBreaker();
          if (e.key === 'q' || e.key === 'Q') Player.cycleWeapon();
          if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') UI.toggleMenu();
        });

        window.addEventListener('keyup', e => {
          this.keys[e.key] = false;
        });

        window.addEventListener('mousemove', e => {
          this.mouseX = e.clientX;
          this.mouseY = e.clientY;
        });

        window.addEventListener('mousedown', e => {
          Sound.init();
          if (Game.state === 'STORY') { Game.advanceDialogue(); return; }
          if (e.button === 0) Player.cycleWeapon();
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // Setup Touch Controls for Mobile
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          document.getElementById('mobile-controls').style.display = 'block';
          this.setupTouch();
        }
      },

      setupTouch() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');

        zone.addEventListener('touchstart', e => {
          const t = e.touches[0];
          const rect = zone.getBoundingClientRect();
          this.joystick.startX = rect.left + rect.width / 2;
          this.joystick.startY = rect.top + rect.height / 2;
          this.joystick.active = true;
          this.handleJoystickMove(t.clientX, t.clientY, knob);
        });

        zone.addEventListener('touchmove', e => {
          if (!this.joystick.active) return;
          const t = e.touches[0];
          this.handleJoystickMove(t.clientX, t.clientY, knob);
        });

        const resetJoy = () => {
          this.joystick.active = false;
          this.joystick.x = 0;
          this.joystick.y = 0;
          knob.style.transform = `translate(-50%, -50%)`;
        };
        zone.addEventListener('touchend', resetJoy);
        zone.addEventListener('touchcancel', resetJoy);

        document.getElementById('btn-slash').addEventListener('touchstart', e => { e.preventDefault(); Player.attack(); });
        document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault(); Player.fireGun(); });
        document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); Player.dash(); });
        document.getElementById('btn-spin').addEventListener('touchstart', e => { e.preventDefault(); Player.spinBreaker(); });
        document.getElementById('btn-cycle').addEventListener('touchstart', e => { e.preventDefault(); Player.cycleWeapon(); });
      },

      handleJoystickMove(cx, cy, knob) {
        let dx = cx - this.joystick.startX;
        let dy = cy - this.joystick.startY;
        const maxDist = 45;
        const dist = Math.hypot(dx, dy);
        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        this.joystick.x = dx / maxDist;
        this.joystick.y = dy / maxDist;
      }
    };

    /* =====================================================================
       UI & MODALS
       ===================================================================== */
    const UI = {
      init() {
        // Build Codex Content
        const codexGrid = document.getElementById('codex-content');
        codexGrid.innerHTML = CODEX_DATA.map(item => `
          <div class="codex-card ${item.class}">
            <div class="codex-tag">${item.tag}</div>
            <div class="codex-name">${item.name}</div>
            <div class="codex-desc">${item.desc}</div>
          </div>
        `).join('');

        document.getElementById('btn-codex').onclick = () => {
          document.getElementById('codex-modal').style.display = 'flex';
        };
        document.getElementById('btn-close-codex').onclick = () => {
          document.getElementById('codex-modal').style.display = 'none';
        };
        document.getElementById('btn-pause').onclick = () => {
          this.toggleMenu();
        };

        document.getElementById('m-btn-resume').onclick = () => this.toggleMenu();
        document.getElementById('m-btn-stage1').onclick = () => { this.toggleMenu(); Game.loadChapter(1); };
        document.getElementById('m-btn-stage2').onclick = () => { this.toggleMenu(); Game.loadChapter(2); };
        document.getElementById('m-btn-stage3').onclick = () => { this.toggleMenu(); Game.loadChapter(3); };
        document.getElementById('m-btn-stage4').onclick = () => { this.toggleMenu(); Game.loadChapter(4); };

        const soundBtn = document.getElementById('m-btn-sound');
        soundBtn.onclick = () => {
          Sound.enabled = !Sound.enabled;
          soundBtn.innerText = Sound.enabled ? "AUDIO: SYNTHESIZER SOUND ON" : "AUDIO: MUTED";
        };
      },

      toggleMenu() {
        const modal = document.getElementById('menu-modal');
        const isShown = modal.style.display === 'flex';
        modal.style.display = isShown ? 'none' : 'flex';
        Game.isPaused = !isShown;
      }
    };

    /* =====================================================================
       MAIN GAME LOOP
       ===================================================================== */
    function loop() {
      // Screen Shake offset
      let shakeX = 0, shakeY = 0;
      if (Game.shake > 0) {
        shakeX = (Math.random() - 0.5) * Game.shake;
        shakeY = (Math.random() - 0.5) * Game.shake;
        Game.shake *= 0.88;
        if (Game.shake < 0.3) Game.shake = 0;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);

      // Background Grid / Post-apocalyptic Arena
      ctx.fillStyle = '#090e15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Floor Grid
      ctx.strokeStyle = '#121d2b';
      ctx.lineWidth = 1;
      const gridSize = 48;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Update & Draw Game Entities
      if (!Game.isPaused) {
        Player.update();
        Enemies.update();
        Boss.update();
        Projectiles.update();
        Pickups.update();
        Particles.update();
      }

      Particles.draw();
      Enemies.draw();
      Pickups.draw();
      Boss.draw();
      Player.draw();
      Projectiles.draw();

      ctx.restore();

      // Screen Flash overlay
      if (Game.flashAlpha > 0) {
        ctx.fillStyle = Game.flashColor;
        ctx.globalAlpha = Game.flashAlpha;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        Game.flashAlpha -= 0.03;
      }

      requestAnimationFrame(loop);
    }

    window.onload = () => Game.init();
  </script>
</body>
</html>
