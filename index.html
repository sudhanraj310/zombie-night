<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blue Zombie: Chronicles of the Hybrid</title>
  <style>
    :root {
      --bg: #06090e;
      --panel: rgba(10, 16, 26, 0.94);
      --border: #1a2a3e;
      --accent: #38bdf8;
      --accent-deep: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --red: #f43f5e;
      --gold: #fbbf24;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      background: #090e15;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      cursor: crosshair;
    }

    /* Cinematic Bars */
    .cinema-bar {
      position: absolute;
      left: 0; right: 0;
      background: #000;
      z-index: 50;
      transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #bar-top { top: 0; height: 0; }
    #bar-bottom { bottom: 0; height: 0; }
    .in-cutscene #bar-top, .in-cutscene #bar-bottom {
      height: 9vh;
    }

    /* Cutscene Dialogue UI */
    #cutscene-ui {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(940px, 94vw);
      background: rgba(8, 14, 24, 0.95);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 22px 28px;
      display: none;
      flex-direction: row;
      gap: 24px;
      align-items: flex-start;
      z-index: 60;
      box-shadow: 0 16px 50px rgba(0,0,0,0.85), 0 0 30px var(--accent-glow);
      backdrop-filter: blur(14px);
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 24px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .speaker-avatar {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      background: #0b121e;
      border: 2px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      margin-top: 4px;
    }
    .dialogue-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
    .speaker-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .speaker-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .speaker-role-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }
    .dialogue-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dialogue-btn-skip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dialogue-btn-skip:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .dialogue-prompt {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 1.2px;
      animation: pulse 1.5s infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .dialogue-text {
      font-size: 16.5px;
      line-height: 1.75;
      letter-spacing: 0.35px;
      color: #f1f5f9;
      min-height: 52px;
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .dialogue-text em {
      color: #94a3b8;
      font-style: italic;
    }
    .dialogue-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 4px;
    }
    .next-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111e30;
      border: 1px solid var(--accent-deep);
      color: var(--accent);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .next-pill:hover {
      background: var(--accent-deep);
      color: #fff;
      transform: translateX(2px);
    }

    /* Top HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 30;
      pointer-events: none;
    }
    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hud-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 290px;
    }
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bar-label {
      font-size: 11px;
      font-weight: 800;
      width: 38px;
      color: var(--text-dim);
    }
    .bar-bg {
      flex: 1;
      height: 10px;
      background: #111a26;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #1f2d3d;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.12s ease-out;
    }
    .bar-hp { background: linear-gradient(90deg, #e11d48, #22c55e); }
    .bar-dash { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    .bar-spin { background: linear-gradient(90deg, #d97706, #fbbf24); }

    .hud-gun-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11.5px;
      font-weight: 700;
      color: #38bdf8;
      cursor: pointer;
    }
    .hud-buffs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 800;
    }
    .buff-tag {
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .buff-fury { background: rgba(240, 185, 79, 0.25); color: #f0b94f; border: 1px solid #f0b94f; }
    .buff-might { background: rgba(183, 116, 255, 0.25); color: #b774ff; border: 1px solid #b774ff; }
    .buff-guard { background: rgba(89, 205, 242, 0.25); color: #59cdf2; border: 1px solid #59cdf2; }
    .buff-haste { background: rgba(110, 230, 142, 0.25); color: #6ee68e; border: 1px solid #6ee68e; }

    .hud-center {
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 24px;
      pointer-events: auto;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .hud-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .hud-buttons {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .icon-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      background: var(--accent-deep);
      border-color: var(--accent);
    }

    /* Boss HUD */
    #boss-hud {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: min(540px, 86vw);
      background: var(--panel);
      border: 1px solid #e11d48;
      border-radius: 6px;
      padding: 10px 18px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.35);
    }
    .boss-name-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fda4af;
      text-transform: uppercase;
    }

    /* Modal Screens */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 12, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: min(860px, 92vw);
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 30px var(--accent-glow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-panel h2 {
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .menu-btn {
      background: #101a27;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background: var(--accent-deep);
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .menu-btn span.badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      font-weight: 600;
    }

    /* Codex entries */
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .codex-card {
      background: #0d1624;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .codex-card.grade-0 { border-color: var(--accent); }
    .codex-card.grade-1 { border-color: #a855f7; }
    .codex-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
    }
    .codex-name { font-size: 15px; font-weight: 700; color: #fff; }
    .codex-desc { font-size: 13px; color: var(--text-dim); line-height: 1.4; }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      display: none;
    }
    .touch-btn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(14, 23, 36, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.5);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 19px;
      pointer-events: auto;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      user-select: none;
    }
    .touch-btn:active {
      transform: scale(0.92);
      border-color: #38bdf8;
    }
    .touch-btn span.btn-lbl {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 1px;
    }
    #btn-slash { bottom: 35px; right: 35px; width: 78px; height: 78px; background: rgba(225, 29, 72, 0.45); border-color: #f43f5e; font-size: 24px; }
    #btn-shoot { bottom: 35px; right: 125px; background: rgba(2, 132, 199, 0.45); border-color: #38bdf8; }
    #btn-dash { bottom: 125px; right: 35px; }
    #btn-spin { bottom: 125px; right: 125px; background: rgba(217, 119, 6, 0.45); border-color: #fbbf24; }
    #btn-cycle { bottom: 205px; right: 80px; }
    #joystick-zone {
      position: absolute;
      bottom: 35px;
      left: 35px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(14, 23, 36, 0.45);
      border: 2px dashed rgba(255,255,255,0.25);
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--accent-deep);
      border: 2px solid var(--accent);
      pointer-events: none;
    }

    /* Notification Banner */
    #banner {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #banner h1 {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(0,0,0,0.9);
      color: #fff;
    }
    #banner p {
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--accent);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Cinematic Overlays -->
    <div id="bar-top" class="cinema-bar"></div>
    <div id="bar-bottom" class="cinema-bar"></div>

    <!-- Cutscene Dialogue Box -->
    <div id="cutscene-ui">
      <div class="speaker-avatar" id="avatar-container">
        <canvas id="avatarCanvas" width="76" height="76"></canvas>
      </div>
      <div class="dialogue-content">
        <div class="dialogue-header">
          <div class="speaker-meta">
            <span class="speaker-name" id="speaker-name">Narrator</span>
            <span class="speaker-role-badge" id="speaker-role">SITUATION REPORT</span>
          </div>
          <div class="dialogue-controls">
            <button class="dialogue-btn-skip" id="btn-skip-cutscene" title="Skip current cutscene">SKIP ❯❯</button>
            <div class="dialogue-prompt">[SPACE / CLICK]</div>
          </div>
        </div>
        <div class="dialogue-text" id="dialogue-text">...</div>
        <div class="dialogue-footer">
          <div class="next-pill" id="btn-next-dialogue">CONTINUE ❯</div>
        </div>
      </div>
    </div>

    <!-- Gameplay Top HUD -->
    <div id="hud">
      <div class="hud-box hud-bars">
        <div class="bar-wrap">
          <div class="bar-label">HP</div>
          <div class="bar-bg"><div id="hp-fill" class="bar-fill bar-hp" style="width: 100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label">DASH</div>
          <div class="bar-bg"><div id="dash-fill" class="bar-fill bar-dash" style="width: 100%"></div></div>
        </div>
        <div class="bar-wrap">
          <div class="bar-label">SPIN</div>
          <div class="bar-bg"><div id="spin-fill" class="bar-fill bar-spin" style="width: 100%"></div></div>
        </div>
        <div class="hud-gun-row" id="hud-gun-info" title="Click or tap to cycle weapons (or press Q / Left Click)">
          <span id="hud-gun-name">GUN: PISTOL (1/1)</span>
          <span id="hud-ammo-count">AMMO: 18</span>
        </div>
        <div class="hud-buffs" id="hud-buffs-list"></div>
      </div>

      <div class="hud-center">
        <div class="hud-title" id="stage-title">PROLOGUE: THE OUTBREAK</div>
        <div class="hud-sub" id="wave-tracker">Threat Level: Grade 5 Horde</div>
      </div>

      <div class="hud-buttons">
        <button class="icon-btn" id="btn-codex">CODEX</button>
        <button class="icon-btn" id="btn-pause">PAUSE</button>
      </div>
    </div>

    <!-- Boss Health Bar -->
    <div id="boss-hud">
      <div class="boss-name-row">
        <span id="boss-title">GRADE 0: THE BLUE ZOMBIE</span>
        <span id="boss-hp-text">100%</span>
      </div>
      <div class="bar-bg" style="height: 12px;">
        <div id="boss-hp-fill" class="bar-fill bar-hp" style="width: 100%"></div>
      </div>
    </div>

    <!-- Mobile Virtual Controls -->
    <div id="mobile-controls">
      <div id="joystick-zone"><div id="joystick-knob"></div></div>
      <button type="button" class="touch-btn" id="btn-cycle" title="Cycle Gun">🔄<span class="btn-lbl">GUN</span></button>
      <button type="button" class="touch-btn" id="btn-spin" title="Spin Breaker">🌀<span class="btn-lbl">SPIN</span></button>
      <button type="button" class="touch-btn" id="btn-dash" title="Dash">⚡<span class="btn-lbl">DASH</span></button>
      <button type="button" class="touch-btn" id="btn-slash" title="Sword Slash">⚔️<span class="btn-lbl">SLASH</span></button>
      <button type="button" class="touch-btn" id="btn-shoot" title="Fire Gun">🔫<span class="btn-lbl">FIRE</span></button>
    </div>

    <!-- Notification Banner -->
    <div id="banner">
      <h1 id="banner-title">STAGE COMPLETE</h1>
      <p id="banner-sub">PREPARE FOR CONFRONTATION</p>
    </div>

    <!-- Pause / Main Menu Modal -->
    <div id="menu-modal" class="modal-overlay">
      <div class="modal-panel">
        <h2 id="modal-heading">MISSION LOG & SYSTEM</h2>
        <div class="menu-options" id="modal-buttons" style="max-height: 480px; overflow-y: auto;">
          <button class="menu-btn" id="m-btn-resume">RESUME MISSION <span class="badge">ESC</span></button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(1);">
            CH 1: Shattered Normalcy
            <span class="badge">District 7</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(2);">
            CH 2: The Edge of Death
            <span class="badge">Central Plaza</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(3);">
            CH 3: The Hybrid Rebirth
            <span class="badge">Haven Medical Bunker</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(4);">
            CH 4: The Pioneer's Legacy
            <span class="badge">Haven Sanctuary</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(5);">
            CH 5: Building Haven & The Lost Friends
            <span class="badge">Haven Settlement</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(6);">
            CH 6: The First Love & A Family Born
            <span class="badge">Haven Sanctuary</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(7);">
            CH 7: Aristocrat's Shadow
            <span class="badge">Haven Perimeter</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(8);">
            CH 8: The Gathering Storm
            <span class="badge">Haven Command Room</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(9);">
            CH 9: The Siege of Haven
            <span class="badge">Haven Outer Barricades</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(10);">
            CH 10: The Sovereign Descends
            <span class="badge">The Scorched Courtyard</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(11);">
            CH 11: The Sovereign's Memory
            <span class="badge">The Psychic Flashback</span>
          </button>
          
          <button class="menu-btn" onclick="UI.toggleMenu(); Game.loadChapter(12);">
            CH 12: The Ultimate Sacrifice & Epilogue
            <span class="badge">The Scorched Ridge</span>
          </button>
          <button class="menu-btn" id="m-btn-sound">AUDIO: SYNTHESIZER SOUND ON</button>
        </div>
      </div>
    </div>

    <!-- Lore Codex Modal -->
    <div id="codex-modal" class="modal-overlay">
      <div class="modal-panel">
        <h2>ZOMBIE HIERARCHY & PERSONNEL DOSSIER</h2>
        <div class="codex-grid" id="codex-content">
          <!-- Filled by JS -->
        </div>
        <button class="icon-btn" id="btn-close-codex" style="align-self: flex-start; padding: 12px 24px; margin-top: 10px;">CLOSE ARCHIVE</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================

    const Sound = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type, duration, gainVal = 0.2, pitchDrop = 0) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (pitchDrop !== 0) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(10, freq - pitchDrop), this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      noise(duration, gainVal = 0.15) {
        if (!this.enabled || !this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * duration;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e) {}
      },
      slash() {
        this.playTone(320, 'triangle', 0.12, 0.25, 180);
        this.noise(0.08, 0.15);
      },
      hit() {
        this.playTone(180, 'sawtooth', 0.15, 0.35, 100);
        this.noise(0.12, 0.2);
      },

      },
      dash() {
        this.playTone(400, 'sine', 0.2, 0.15, 250);
      },
      overdrive() {
        this.playTone(220, 'sawtooth', 0.4, 0.3, -400);
        this.playTone(440, 'triangle', 0.5, 0.3, -200);
      },
      beep(pitch = 500) {
        this.playTone(pitch, 'sine', 0.04, 0.06);
      },
      bossShockwave() {
        this.playTone(90, 'sawtooth', 0.6, 0.5, 50);
        this.noise(0.4, 0.35);
      }
    };

      playCutscene(scriptArray, onFinish) {
        this.state = 'STORY';
        this.script = scriptArray;
        this.scriptIndex = 0;
        this.onCutsceneFinish = onFinish;
        document.body.classList.add('in-cutscene');
        const cutsceneBox = document.getElementById('cutscene-ui');
        cutsceneBox.style.display = 'flex';
        
        // Setup interactive button events
        document.getElementById('btn-skip-cutscene').onclick = (e) => {
          e.stopPropagation();
          this.endCutscene();
        };
        document.getElementById('btn-next-dialogue').onclick = (e) => {
          e.stopPropagation();
          this.advanceDialogue();
        };
        cutsceneBox.onclick = () => {
          this.advanceDialogue();
        };

        this.showDialogueLine();
      },

      showDialogueLine() {
        if (this.scriptIndex >= this.script.length) {
          this.endCutscene();
          return;
        }
        const item = this.script[this.scriptIndex];
        const speakerEl = document.getElementById('speaker-name');
        const roleEl = document.getElementById('speaker-role');
        const cutsceneBox = document.getElementById('cutscene-ui');

        speakerEl.innerText = item.speaker;
        speakerEl.style.color = item.theme || '#38bdf8';
        roleEl.innerText = item.role || 'COMMUNICATION';
        roleEl.style.color = item.theme || '#38bdf8';
        roleEl.style.borderColor = (item.theme || '#38bdf8') + '55';
        roleEl.style.backgroundColor = (item.theme || '#38bdf8') + '1a';
        cutsceneBox.style.borderLeftColor = item.theme || '#38bdf8';
        cutsceneBox.style.boxShadow = `0 16px 50px rgba(0,0,0,0.85), 0 0 30px ${item.theme || '#38bdf8'}33`;

        this.renderAvatar(item.speaker, item.theme);
        
        const textEl = document.getElementById('dialogue-text');
        textEl.innerText = "";
        this.dialogueTextTarget = item.text;
        this.charIndex = 0;

        if (this.dialogueTimer) clearInterval(this.dialogueTimer);
        this.dialogueTimer = setInterval(() => {
          if (this.charIndex < this.dialogueTextTarget.length) {
            textEl.innerText += this.dialogueTextTarget[this.charIndex];
            if (this.charIndex % 3 === 0) {
              const pitch = item.speaker.includes('BLUE ZOMBIE') ? 220 : (item.speaker.includes('AGENT X') ? 360 : (item.speaker.includes('VANCE') ? 440 : 540));
              Sound.beep(pitch);
            }
            this.charIndex++;
          } else {
            clearInterval(this.dialogueTimer);
          }
        }, 20);
      },

      advanceDialogue() {
        if (this.charIndex < this.dialogueTextTarget.length) {
          // Instant complete line
          clearInterval(this.dialogueTimer);
          document.getElementById('dialogue-text').innerText = this.dialogueTextTarget;
          this.charIndex = this.dialogueTextTarget.length;
        } else {
          this.scriptIndex++;
          this.showDialogueLine();
        }
      },

      endCutscene() {
        if (this.dialogueTimer) clearInterval(this.dialogueTimer);
        document.body.classList.remove('in-cutscene');
        document.getElementById('cutscene-ui').style.display = 'none';
        if (this.onCutsceneFinish) {
          const fn = this.onCutsceneFinish;
          this.onCutsceneFinish = null;
          fn();
        }
      },

      spawnHorde(count, maxGrade = 5) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            if (this.state !== 'PLAYING') return;
            const angle = Math.random() * Math.PI * 2;
            const dist = 550 + Math.random() * 200;
            const x = Player.x + Math.cos(angle) * dist;
            const y = Player.y + Math.sin(angle) * dist;
            let grade = 5;
            if (maxGrade <= 4 && Math.random() > 0.45) grade = 4;
            if (maxGrade <= 3 && Math.random() > 0.7) grade = 3;
            Enemies.spawn(x, y, grade);
          }, i * 350);
        }
      },

      onEnemyDefeated(enemy) {
        this.enemiesKilled++;

        // Loot drops (zombie-night logic)
        if (!Player.starterGunDropped) {
          Pickups.drop(enemy.x, enemy.y, false, 'gun');
          Player.starterGunDropped = true;
        } else if (Player.currentGun && Player.gunAmmo <= 6) {
          Pickups.drop(enemy.x, enemy.y, false, 'ammo');
        } else if (Math.random() < 0.35) {
          Pickups.drop(enemy.x, enemy.y, false);
        }

        document.getElementById('wave-tracker').innerText = `Defeated: ${this.enemiesKilled} / ${this.quotaKilled}`;
        if (this.quotaKilled && this.enemiesKilled >= this.quotaKilled) {
          this.quotaKilled = 0;
          Enemies.list = [];
          const nextCh = this.currentChapter + 1;
          if (nextCh <= MASTER_CHAPTERS.length) {
            this.showBanner("CHAPTER COMPLETED", `PREPARING CHAPTER ${nextCh}...`);
            setTimeout(() => { this.loadChapter(nextCh); }, 2500);
          } else {
            this.showBanner("WAR FOR TOMORROW", "EPILOGUE COMPLETE — SANCTUARY ENDURES");
          }
        }
      },
