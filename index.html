        } else if (this.currentChapter === 10) {
          // Chapter 10: Sovereign clash initiates psychic resonance
          setTimeout(() => { this.loadChapter(11); }, 2000);
        } else if (this.currentChapter === 11) {
          // Chapter 11: Memory unlocked, entering final reckoning
          setTimeout(() => { this.loadChapter(12); }, 2000);
        } else if (this.currentChapter === 12) {
          // Chapter 12: Ultimate Mutual Sacrifice Finale!
          this.showBanner("ULTIMATE SACRIFICE", "REST IN PEACE, ZEST");
          this.playCutscene(MASTER_CHAPTERS[11].lines, () => {
            this.showBanner("THE UNBROKEN DAWN", "HUMANITY ENDURES IN HAVEN");
          });
        } else {
          const nextCh = this.currentChapter + 1;
          if (nextCh <= MASTER_CHAPTERS.length) {
            this.loadChapter(nextCh);
          }
        }
      },

      showBanner(title, sub) {
        const b = document.getElementById('banner');
        document.getElementById('banner-title').innerText = title;
        document.getElementById('banner-sub').innerText = sub;
        b.style.display = 'block';
        setTimeout(() => { b.style.display = 'none'; }, 4000);
      }
    };

    /* =====================================================================
       GUNS DEFINITION (exact zombie-night specs)
       ===================================================================== */
    const GUNS = {
      pistol:     { name: 'PISTOL',       dmg: 48,  range: 370, cooldown: 20, pellets: 1, spread: 0.035, ammo: 18, color: '#fbbf24' },
      shotgun:    { name: 'SHOTGUN',      dmg: 23,  range: 220, cooldown: 43, pellets: 5, spread: 0.25,  ammo: 10, color: '#f97316' },
      rifle:      { name: 'RIFLE',        dmg: 74,  range: 500, cooldown: 11, pellets: 1, spread: 0.02,  ammo: 28, color: '#34d399' },
      machinegun: { name: 'VULCAN MACHINE GUN', dmg: 48, range: 480, cooldown: 3, pellets: 1, spread: 0.08, ammo: 150, color: '#f87171' }
    };
    const GUN_ORDER = ['pistol', 'shotgun', 'rifle', 'machinegun'];

    /* =====================================================================
       PICKUPS / LOOT DROPS
       ===================================================================== */
    const Pickups = {
      list: [],
      drop(x, y, isBoss = false, forcedType = null) {
        const pool = ['med', 'fury', 'might', 'guard', 'haste', 'ammo', 'gun'];
        let type = forcedType || pool[Math.floor(Math.random() * pool.length)];
        let gunKey = null;
        if (type === 'gun') {
          const available = GUN_ORDER.filter(k => !Player.arsenal.includes(k));
          if (available.length === 0) { type = 'ammo'; } else {
            gunKey = available[Math.floor(Math.random() * available.length)];
          }
        }
        this.list.push({ x, y, type, gunKey, life: 420, spin: 0 });
        if (isBoss) {
          // bonus drop
          const bonusPool = ['fury', 'might', 'guard', 'haste'];
          this.list.push({ x: x + 28, y, type: bonusPool[Math.floor(Math.random() * bonusPool.length)], gunKey: null, life: 420, spin: 0 });
        }
      },
      collect(drop) {
        const labels = { med:'MED KIT', fury:'FURY', might:'MIGHT', guard:'GUARD', haste:'HASTE', ammo:'AMMO', gun:'NEW GUN' };
        switch(drop.type) {
          case 'med':
            Player.hp = Math.min(Player.maxHp, Player.hp + 28);
            Game.showBanner('MED KIT', '+28 HP');
            break;
          case 'fury':
            Player.furyTimer = 420; // 7s
            Game.showBanner('FURY', 'FAST SLASHES');
            break;
          case 'might':
            Player.mightTimer = 540; // 9s
            Game.showBanner('MIGHT', '+65% DAMAGE');
            break;
          case 'guard':
            Player.guardTimer = 540;
            Game.showBanner('GUARD', '58% LESS DAMAGE');
            break;
          case 'haste':
            Player.hasteTimer = 540;
            Game.showBanner('HASTE', '+28% SPEED');
            break;
          case 'ammo':
            if (Player.currentGun) {
              const add = 8 + Math.floor(Math.random() * 11);
              Player.gunAmmo = Math.min(GUNS[Player.currentGun].ammo * 2, Player.gunAmmo + add);
            }
            break;
          case 'gun':
            if (drop.gunKey && !Player.arsenal.includes(drop.gunKey)) {
              Player.arsenal.push(drop.gunKey);
              if (!Player.currentGun) { Player.currentGun = drop.gunKey; Player.gunAmmo = GUNS[drop.gunKey].ammo; Player.gunCooldown = 0; }
              Game.showBanner('NEW GUN', GUNS[drop.gunKey].name + ' ACQUIRED');
            }
            break;
        }
        Sound.hit();
        Player.updateHUD();
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const d = this.list[i];
          d.life--;
          d.spin += 0.04;
          // Collect if player overlaps
          if (Math.hypot(Player.x - d.x, Player.y - d.y) < Player.radius + 18) {
            this.collect(d);
            this.list.splice(i, 1);
            continue;
          }
          if (d.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        const colorMap = { med:'#22c55e', fury:'#f59e0b', might:'#ef4444', guard:'#3b82f6', haste:'#a855f7', ammo:'#94a3b8', gun:'#fbbf24' };
        const iconMap  = { med:'➕', fury:'⚡', might:'💥', guard:'🛡', haste:'💨', ammo:'🔹', gun:'🔫' };
        for (let d of this.list) {
          const alpha = Math.min(1, d.life / 60);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(d.x, d.y);
          ctx.rotate(d.spin);
          ctx.shadowColor = colorMap[d.type];
          ctx.shadowBlur = 14;
          ctx.strokeStyle = colorMap[d.type];
          ctx.lineWidth = 2.5;
          ctx.strokeRect(-14, -14, 28, 28);
          ctx.fillStyle = 'rgba(9,14,21,0.72)';
          ctx.fillRect(-14, -14, 28, 28);
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = '15px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(iconMap[d.type], d.x, d.y);
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       PLAYER (Boy / Transformed Hybrid) — zombie-night compatible
       ===================================================================== */
    const Player = {
      x: 0,
      y: 0,
      radius: 18,
      speed: 4.8,
      hp: 100,
      maxHp: 250, hp: 250,
      isHybrid: false,
      angle: 0,

      // Sword combo
      comboStep: 0,
      comboTimer: 0,
      attackCooldown: 0,

      // Dash
      isDashing: false,
      dashFrames: 0,
      dashCooldown: 0,
      dashDirX: 0,
      dashDirY: 0,

      // Spin-Breaker
      spinCooldown: 0,
      // OP Skills
      voidPulseCooldown: 0,
      azureOverdriveActive: false,
      azureOverdriveTimer: 0,
      azureOverdriveCooldown: 0,
      chainLightningCooldown: 0,

      // Buffs (frame counters)
      furyTimer: 0,
      mightTimer: 0,
      guardTimer: 0,
      hasteTimer: 0,

      // Gun system
      currentGun: null,
      arsenal: [],
      gunIndex: 0,
      gunAmmo: 0,
      gunCooldown: 0,

      // Loot state
      starterGunDropped: false,

      resetForChapter(ch) {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.maxHp = this.isHybrid ? 350 : 250;
        this.hp = this.maxHp;
        this.isHybrid = ch >= 2;
        this.speed = this.isHybrid ? 6.8 : 5.2;
        this.isDashing = false; this.dashFrames = 0; this.dashCooldown = 0;
        this.spinCooldown = 0; this.voidPulseCooldown = 0; this.azureOverdriveActive = false; this.azureOverdriveTimer = 0; this.azureOverdriveCooldown = 0; this.chainLightningCooldown = 0;
        this.comboStep = 0; this.comboTimer = 0; this.attackCooldown = 0;
        this.furyTimer = 0; this.mightTimer = 0; this.guardTimer = 0; this.hasteTimer = 0;
        // ZEST STARTS WITH HEAVY MACHINE GUN + RIFLE
        this.arsenal = ['machinegun', 'rifle', 'shotgun', 'pistol'];
        this.currentGun = 'machinegun';
        this.gunIndex = 0;
        this.gunAmmo = 150;
        this.gunCooldown = 0;
        this.starterGunDropped = false;
        Pickups.list = [];
        this.updateHUD();
      },

      update() {
        if (Game.state !== 'PLAYING') return;

        // Buff timers
        if (this.furyTimer > 0) this.furyTimer--;
        if (this.mightTimer > 0) this.mightTimer--;
        if (this.guardTimer > 0) this.guardTimer--;
        if (this.hasteTimer > 0) this.hasteTimer--;

        // Cooldowns
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.spinCooldown > 0) this.spinCooldown--;
        if (this.gunCooldown > 0) this.gunCooldown--;
        if (this.voidPulseCooldown > 0) this.voidPulseCooldown--;
        if (this.chainLightningCooldown > 0) this.chainLightningCooldown--;
        if (this.azureOverdriveCooldown > 0) this.azureOverdriveCooldown--;

        if (this.azureOverdriveActive) {
          this.azureOverdriveTimer--;
          this.hp = Math.min(this.maxHp, this.hp + 0.35);
          if (this.azureOverdriveTimer <= 0) this.azureOverdriveActive = false;
        }

        // Combo reset
        if (this.comboTimer > 0) { this.comboTimer--; if (this.comboTimer <= 0) this.comboStep = 0; }

        // Dashing
        if (this.isDashing) {
          this.x += this.dashDirX * 13;
          this.y += this.dashDirY * 13;
          this.dashFrames--;
          Particles.spawnDashGhost(this.x, this.y, this.angle, this.isHybrid);
          if (this.dashFrames <= 0) this.isDashing = false;
          this.clamp();
          return;
        }

        // Auto-fire when Shift held or right mouse held
        if ((Input.shiftHeld || Input.keys['Shift']) && Game.state === 'PLAYING') {
          this.fireGun();
        }

        // Movement
        let dx = 0, dy = 0;
        if (Input.keys['w'] || Input.keys['W'] || Input.keys['ArrowUp']) dy -= 1;
        if (Input.keys['s'] || Input.keys['S'] || Input.keys['ArrowDown']) dy += 1;
        if (Input.keys['a'] || Input.keys['A'] || Input.keys['ArrowLeft']) dx -= 1;
        if (Input.keys['d'] || Input.keys['D'] || Input.keys['ArrowRight']) dx += 1;
        if (Input.joystick.active) { dx = Input.joystick.x; dy = Input.joystick.y; }

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy);
          let spd = this.speed * (this.hasteTimer > 0 ? 1.28 : 1) * (this.azureOverdriveActive ? 1.5 : 1);
          this.x += (dx / len) * spd;
          this.y += (dy / len) * spd;
        }

        // Auto-aim: lock to nearest enemy within 300px, else mouse
        let aimX = Input.mouseX, aimY = Input.mouseY;
        let nearest = null, nearDist = 300;
        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < nearDist) { nearDist = d; nearest = e; }
        }
        if (Boss.active) {
          const bd = Math.hypot(Boss.x - this.x, Boss.y - this.y);
          if (bd < nearDist) { nearest = Boss; }
        }
        if (nearest) { aimX = nearest.x; aimY = nearest.y; }
        this.angle = Math.atan2(aimY - this.y, aimX - this.x);

        this.clamp();
        this.updateHUD();
      },

      clamp() {
        const pad = 30;
        this.x = Math.max(pad, Math.min(canvas.width - pad, this.x));
        this.y = Math.max(pad, Math.min(canvas.height - pad, this.y));
      },

      attack() {
        if (this.attackCooldown > 0) return;
        const cd = this.furyTimer > 0 ? 8 : 14;
        this.comboStep = (this.comboStep % 3) + 1;
        this.comboTimer = 35;
        this.attackCooldown = cd;
        Sound.slash();
        Game.shake = 4;

        // SF2 COMPOSITE SWORD: Segmented whip-blade with massive range and serrated slashes
        const range = this.isHybrid ? 135 : 85;
        const arc = Math.PI * 0.85;
        let dmg = (this.isHybrid ? 88 : 45); // Much more powerful than Agent X!
        if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);
        if (this.azureOverdriveActive) dmg = Math.floor(dmg * 2.0);

        for (let e of Enemies.list) {
          const dist = Math.hypot(e.x - this.x, e.y - this.y);
          if (dist < range + e.radius) {
            const angleTo = Math.atan2(e.y - this.y, e.x - this.x);
            let diff = Math.abs(angleTo - this.angle);
            while (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < arc / 2) e.takeDamage(dmg, Math.cos(this.angle) * 8, Math.sin(this.angle) * 8);
          }
        }
        if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < range + Boss.radius) Boss.takeDamage(dmg);
        Particles.spawnCompositeSwordSlash(this.x, this.y, this.angle, range, this.isHybrid, this.comboStep);
      },

      fireGun() {
        if (!this.currentGun || this.gunAmmo <= 0 || this.gunCooldown > 0) return;
        const g = GUNS[this.currentGun];
        this.gunCooldown = g.cooldown;
        this.gunAmmo--;
        Sound.blaster();
        Game.shake = 2;

        for (let i = 0; i < g.pellets; i++) {
          const spread = (Math.random() - 0.5) * g.spread;
          const ang = this.angle + spread;
          const spd = g.range / 35;
          const life = Math.floor(g.range / spd);
          let dmg = g.dmg;
          if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);
          if (this.azureOverdriveActive) dmg = Math.floor(dmg * 2.0);
          this.spawnPlayerBullet(this.x, this.y, ang, spd, dmg, life);
        }
        this.updateHUD();
      },

      spawnPlayerBullet(x, y, angle, speed, dmg, life) {
        Projectiles.list.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          dmg, type: 'BULLET', life, maxLife: life, angle, isPlayer: true
        });
      },

      spinBreaker() {
        if (this.spinCooldown > 0) return;
        this.spinCooldown = 264; // 4.4s
        Sound.overdrive();
        Game.shake = 14;
        Game.flashAlpha = 0.5;
        Game.flashColor = '#38bdf8';

        const range = this.isHybrid ? 220 : 160;
        let dmg = this.isHybrid ? 110 : 70;
        if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);

        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < range) {
            const ang = Math.atan2(e.y - this.y, e.x - this.x);
            e.takeDamage(dmg, Math.cos(ang) * 12, Math.sin(ang) * 12);
          }
        }
        if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < range) Boss.takeDamage(dmg);
        Particles.spawnShockwave(this.x, this.y, this.isHybrid ? '#38bdf8' : '#94a3b8', range);
      },

      dash() {
        if (this.isDashing || this.dashCooldown > 0) return;
        this.isDashing = true;
        this.dashFrames = 9;
        this.dashCooldown = 66; // ~1.1s
        Sound.dash();

        let dx = 0, dy = 0;
        if (Input.keys['w'] || Input.keys['W'] || Input.keys['ArrowUp']) dy -= 1;
        if (Input.keys['s'] || Input.keys['S'] || Input.keys['ArrowDown']) dy += 1;
        if (Input.keys['a'] || Input.keys['A'] || Input.keys['ArrowLeft']) dx -= 1;
        if (Input.keys['d'] || Input.keys['D'] || Input.keys['ArrowRight']) dx += 1;
        if (Input.joystick.active) { dx = Input.joystick.x; dy = Input.joystick.y; }
        if (dx === 0 && dy === 0) { dx = Math.cos(this.angle); dy = Math.sin(this.angle); }
        const len = Math.hypot(dx, dy);
        this.dashDirX = dx / len;
        this.dashDirY = dy / len;
      },

      cycleWeapon() {
        if (this.arsenal.length < 2) return;
        this.gunIndex = (this.gunIndex + 1) % this.arsenal.length;
        this.currentGun = this.arsenal[this.gunIndex];
        this.gunAmmo = GUNS[this.currentGun].ammo;
        this.gunCooldown = 0;
        Sound.dash();
        this.updateHUD();
      },

      
      // OP SKILL 1: VOID PULSE (R) — Gravity Implosion + Shockwave
      voidPulse() {
        if (this.voidPulseCooldown > 0) return;
        this.voidPulseCooldown = 480; // 8s
        Sound.bossShockwave();
        Game.shake = 20;
        Game.flashAlpha = 0.6;
        Game.flashColor = '#7c3aed';

        const pullRange = 280;
        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < pullRange && d > 10) {
            e.x += (this.x - e.x) * 0.6;
            e.y += (this.y - e.y) * 0.6;
          }
        }

        setTimeout(() => {
          Sound.overdrive();
          Game.shake = 18;
          Game.flashAlpha = 0.5;
          Game.flashColor = '#a855f7';
          const blastRange = 240;
          let dmg = this.isHybrid ? 180 : 90;
          if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);
          for (let e of Enemies.list) {
            const d = Math.hypot(e.x - this.x, e.y - this.y);
            if (d < blastRange) {
              const ang = Math.atan2(e.y - this.y, e.x - this.x);
              e.takeDamage(dmg, Math.cos(ang) * 18, Math.sin(ang) * 18);
            }
          }
          if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < blastRange) Boss.takeDamage(dmg);
          Particles.spawnShockwave(this.x, this.y, '#a855f7', blastRange);
          Particles.spawnShockwave(this.x, this.y, '#7c3aed', blastRange * 0.6);
        }, 250);
        Particles.spawnShockwave(this.x, this.y, '#7c3aed', pullRange);
      },

      // OP SKILL 2: AZURE OVERDRIVE (T) — God-Mode Transformation
      azureOverdrive() {
        if (this.azureOverdriveActive || this.azureOverdriveCooldown > 0) return;
        this.azureOverdriveActive = true;
        this.azureOverdriveTimer = 480; // 8s
        this.azureOverdriveCooldown = 1200; // 20s
        Sound.overdrive();
        Game.shake = 25;
        Game.flashAlpha = 0.7;
        Game.flashColor = '#38bdf8';

        const burstRange = 200;
        let burstDmg = 120;
        for (let e of Enemies.list) {
          const d = Math.hypot(e.x - this.x, e.y - this.y);
          if (d < burstRange) {
            const ang = Math.atan2(e.y - this.y, e.x - this.x);
            e.takeDamage(burstDmg, Math.cos(ang) * 14, Math.sin(ang) * 14);
          }
        }
        if (Boss.active && Math.hypot(Boss.x - this.x, Boss.y - this.y) < burstRange) Boss.takeDamage(burstDmg);
        Particles.spawnShockwave(this.x, this.y, '#38bdf8', 260);
        Particles.spawnShockwave(this.x, this.y, '#0ea5e9', 180);
      },

      // OP SKILL 3: CHAIN LIGHTNING (G) — Multi-Target Bouncing Arc
      chainLightning() {
        if (this.chainLightningCooldown > 0) return;
        this.chainLightningCooldown = 300; // 5s
        Sound.blaster();
        Game.shake = 8;
        Game.flashAlpha = 0.3;
        Game.flashColor = '#facc15';

        let dmg = this.isHybrid ? 95 : 55;
        if (this.mightTimer > 0) dmg = Math.floor(dmg * 1.65);
        const maxBounces = 6;
        const bounceRange = 220;
        let lastX = this.x, lastY = this.y;
        const hit = new Set();

        for (let b = 0; b < maxBounces; b++) {
          let closest = null, closestDist = bounceRange;
          for (let e of Enemies.list) {
            if (hit.has(e)) continue;
            const d = Math.hypot(e.x - lastX, e.y - lastY);
            if (d < closestDist) { closestDist = d; closest = e; }
          }
          if (Boss.active && !hit.has(Boss) && Math.hypot(Boss.x - lastX, Boss.y - lastY) < closestDist) {
            closest = Boss;
          }
          if (!closest) break;
          hit.add(closest);
          Particles.spawnLightningArc(lastX, lastY, closest.x, closest.y);
          if (closest === Boss) { Boss.takeDamage(dmg); }
          else { closest.takeDamage(dmg, 0, 0); }
          lastX = closest.x;
          lastY = closest.y;
        }
      },
      takeDamage(amount) {
        if (this.isDashing) return;
        let dmg = this.guardTimer > 0 ? Math.floor(amount * 0.42) : amount;
        this.hp -= dmg;
        Sound.hit();
        Game.shake = 8;
        Game.flashAlpha = 0.3;
        Game.flashColor = '#e11d48';
        if (this.hp <= 0) {
          this.hp = 0;
          Game.showBanner("CRITICAL INJURY", "RETRYING MISSION...");
          setTimeout(() => { Game.loadChapter(Game.currentChapter); }, 1500);
        }
      },

      // kept for backward-compat with overdrive calls (no-op now)
      addOverdrive() {},

      updateHUD() {
        document.getElementById('hp-fill').style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;

        // DASH bar: 0 = cooling down, 100 = ready
        const dashPct = this.dashCooldown > 0 ? Math.max(0, (1 - this.dashCooldown / 66) * 100) : 100;
        document.getElementById('dash-fill').style.width = `${dashPct}%`;

        // SPIN bar
        const spinPct = this.spinCooldown > 0 ? Math.max(0, (1 - this.spinCooldown / 264) * 100) : 100;
        document.getElementById('spin-fill').style.width = `${spinPct}%`;

        // Gun row
        if (this.currentGun) {
          const g = GUNS[this.currentGun];
          document.getElementById('hud-gun-name').innerText = `GUN: ${g.name} (${this.gunIndex + 1}/${this.arsenal.length})`;
          document.getElementById('hud-ammo-count').innerText = `AMMO: ${this.gunAmmo}`;
          document.getElementById('hud-gun-info').style.display = 'flex';
        } else {
          document.getElementById('hud-gun-info').style.display = 'none';
        }

        // Buff tags
        const bl = document.getElementById('hud-buffs-list');
        let html = '';
        if (this.furyTimer  > 0) html += `<span class="buff-tag buff-fury">FURY ${Math.ceil(this.furyTimer/60)}s</span>`;
        if (this.mightTimer > 0) html += `<span class="buff-tag buff-might">MIGHT ${Math.ceil(this.mightTimer/60)}s</span>`;
        if (this.guardTimer > 0) html += `<span class="buff-tag buff-guard">GUARD ${Math.ceil(this.guardTimer/60)}s</span>`;
        if (this.hasteTimer > 0) html += `<span class="buff-tag buff-haste">HASTE ${Math.ceil(this.hasteTimer/60)}s</span>`;
        if (this.azureOverdriveActive) html += `<span class="buff-tag buff-fury">⚡ OVERDRIVE ${Math.ceil(this.azureOverdriveTimer/60)}s</span>`;
        if (this.voidPulseCooldown > 0) html += `<span class="buff-tag" style="background:rgba(124,58,237,0.3);border-color:#7c3aed">VOID ${Math.ceil(this.voidPulseCooldown/60)}s</span>`;
        if (this.chainLightningCooldown > 0) html += `<span class="buff-tag" style="background:rgba(250,204,21,0.3);border-color:#facc15">CHAIN ${Math.ceil(this.chainLightningCooldown/60)}s</span>`;
        if (this.azureOverdriveCooldown > 0 && !this.azureOverdriveActive) html += `<span class="buff-tag" style="background:rgba(56,189,248,0.3);border-color:#38bdf8">AZ.OD ${Math.ceil(this.azureOverdriveCooldown/60)}s</span>`;
        bl.innerHTML = html;
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.isHybrid) {
          const auraGlow = this.azureOverdriveActive ? 45 : (this.spinCooldown === 0 ? 30 : 15);
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + (this.azureOverdriveActive ? 12 : 6), 0, Math.PI * 2);
          ctx.fillStyle = this.azureOverdriveActive ? 'rgba(56, 189, 248, 0.55)' : 'rgba(56, 189, 248, 0.18)';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = auraGlow;
          ctx.fill();
        }

        ctx.rotate(this.angle);

        ctx.fillStyle = this.isHybrid ? '#0284c7' : '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = this.isHybrid ? '#38bdf8' : '#64748b';
        ctx.stroke();

        // SF2 COMPOSITE SWORD RENDERING (Segmented weapon)
        const isSwinging = this.attackCooldown > 0;
        const swordLen = isSwinging ? 48 : 34;
        const numSegments = 5;

        ctx.shadowColor = this.isHybrid ? '#38bdf8' : '#e2e8f0';
        ctx.shadowBlur = this.isHybrid ? 14 : 4;
        
        // Sword Hilt & Guard
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(10, 6, 8, 4);
        ctx.fillStyle = '#f59e0b'; // Gold guard accents
        ctx.fillRect(16, 3, 3, 10);

        // Segmented linked blade pieces (Shadow Fight 2 Composite Sword)
        for (let s = 0; s < numSegments; s++) {
          const segX = 19 + s * (swordLen / numSegments);
          const segY = 8 + (isSwinging ? Math.sin(s * 0.9) * 4 : 0);
          
          ctx.fillStyle = this.isHybrid ? '#38bdf8' : '#cbd5e1';
          ctx.beginPath();
          ctx.moveTo(segX, segY - 3);
          ctx.lineTo(segX + 7, segY);
          ctx.lineTo(segX, segY + 3);
          ctx.closePath();
          ctx.fill();

          // Glowing connecting wire/chain
          ctx.strokeStyle = this.isHybrid ? '#0ea5e9' : '#64748b';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(segX - 2, segY);
          ctx.lineTo(segX, segY);
          ctx.stroke();
        }

        // Off-hand: Equipped Vulcan Machine Gun
        if (this.currentGun === 'machinegun') {
          ctx.fillStyle = '#334155';
          ctx.fillRect(8, -12, 18, 5); // Gun body
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(20, -13, 8, 2); // Laser sight / barrel
          ctx.fillStyle = '#64748b';
          ctx.fillRect(14, -7, 5, 4);  // Drum mag
        }

        ctx.fillStyle = this.isHybrid ? '#ffffff' : '#000000';
        ctx.shadowBlur = this.isHybrid ? 8 : 0;
        ctx.beginPath();
        ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
        ctx.arc(8, 5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    };

    /* =====================================================================
       ENEMIES (Grades 5, 4, 3)
       ===================================================================== */
    const Enemies = {
      list: [],
      spawn(x, y, grade = 5) {
        let hp = 40, speed = 2.2, radius = 16, color = '#22c55e', stroke = '#15803d';
        if (grade === 4) { // Stalker
          hp = 70; speed = 3.4; radius = 17; color = '#eab308'; stroke = '#ca8a04';
        } else if (grade === 3) { // Armed Apex Predator
          hp = 140; speed = 2.0; radius = 22; color = '#f97316'; stroke = '#c2410c';
        }
        this.list.push({
          x, y, grade, hp, maxHp: hp, speed, radius, color, stroke,
          vx: 0, vy: 0,
          attackTimer: 0,
          takeDamage(dmg, kx = 0, ky = 0) {
            this.hp -= dmg;
            this.vx += kx;
            this.vy += ky;
            Sound.hit();
            Particles.spawnBlood(this.x, this.y, this.color);
            if (this.hp <= 0) {
              this.isDead = true;
              Game.onEnemyDefeated(this);
            }
          }
        });
      },

      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const e = this.list[i];
          if (e.isDead) {
            this.list.splice(i, 1);
            continue;
          }

          // Knockback decay
          e.x += e.vx; e.y += e.vy;
          e.vx *= 0.85; e.vy *= 0.85;

          // AI Tracking
          const dx = Player.x - e.x;
          const dy = Player.y - e.y;
          const dist = Math.hypot(dx, dy);

          if (dist > e.radius + Player.radius) {
            e.x += (dx / dist) * e.speed;
            e.y += (dy / dist) * e.speed;
          } else {
            // Attack player
            e.attackTimer++;
            if (e.attackTimer > 35) {
              e.attackTimer = 0;
              const dmg = e.grade === 3 ? 22 : (e.grade === 4 ? 14 : 9);
              Player.takeDamage(dmg);
            }
          }

          // Zombie-zombie collision avoidance
          for (let j = 0; j < this.list.length; j++) {
            if (i === j) continue;
            const o = this.list[j];
            const d = Math.hypot(o.x - e.x, o.y - e.y);
            if (d < e.radius + o.radius) {
              const push = (e.radius + o.radius - d) * 0.2;
              const ang = Math.atan2(e.y - o.y, e.x - o.x);
              e.x += Math.cos(ang) * push;
              e.y += Math.sin(ang) * push;
            }
          }
        }
      },

      draw() {
        for (let e of this.list) {
          ctx.save();
          ctx.translate(e.x, e.y);
          const ang = Math.atan2(Player.y - e.y, Player.x - e.x);
          ctx.rotate(ang);

          // Body
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = e.stroke;
          ctx.stroke();

          // Claws / Weapons
          if (e.grade === 3) {
            // Cleaver / Axe
            ctx.fillStyle = '#64748b';
            ctx.fillRect(10, 6, 16, 6);
          } else {
            // Claws
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(8, 8); ctx.lineTo(16, 11);
            ctx.moveTo(8, -8); ctx.lineTo(16, -11);
            ctx.stroke();
          }

          // Health bar above head
          ctx.restore();
          if (e.hp < e.maxHp) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(e.x - 16, e.y - e.radius - 10, 32, 5);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(e.x - 16, e.y - e.radius - 10, (e.hp / e.maxHp) * 32, 5);
          }
        }
      }
    };

    /* =====================================================================
       BOSS SYSTEM (Agent X & Blue Zombie)
       ===================================================================== */
    const Boss = {
      active: false,
      type: '', // 'AGENT_X' or 'BLUE_ZOMBIE'
      x: 0, y: 0,
      radius: 26,
      hp: 1000,
      maxHp: 1000,
      phase: 1,
      attackTimer: 0,
      angle: 0,
      state: 'IDLE',
      teleportTimer: 0,

      spawnAgentX() {
        this.active = true;
        this.type = 'AGENT_X';
        this.x = canvas.width / 2;
        this.y = 140;
        this.hp = 850;
        this.maxHp = 850;
        this.radius = 24;
        this.showHUD("GRADE 1: AGENT X (ARISTOCRAT)");
      },

      spawnBlueZombie() {
        this.active = true;
        this.type = 'BLUE_ZOMBIE';
        this.x = canvas.width / 2;
        this.y = 140;
        this.hp = 1400;
        this.maxHp = 1400;
        this.radius = 28;
        this.showHUD("GRADE 0: THE BLUE ZOMBIE (SOVEREIGN)");
      },

      showHUD(title) {
        document.getElementById('boss-title').innerText = title;
        document.getElementById('boss-hud').style.display = 'flex';
        this.updateHUD();
      },

      updateHUD() {
        const pct = Math.max(0, (this.hp / this.maxHp) * 100);
        document.getElementById('boss-hp-fill').style.width = `${pct}%`;
        document.getElementById('boss-hp-text').innerText = `${Math.ceil(pct)}%`;
      },

      takeDamage(dmg) {
        if (!this.active) return;
        this.hp -= dmg;
        Sound.hit();
        Particles.spawnBlood(this.x, this.y, this.type === 'BLUE_ZOMBIE' ? '#38bdf8' : '#881337');
        this.updateHUD();

        if (this.hp <= 0) {
          this.active = false;
          document.getElementById('boss-hud').style.display = 'none';
          // Boss loot drops
          Pickups.drop(this.x - 18, this.y, true, 'gun');
          Pickups.drop(this.x + 18, this.y, true);
          Game.onBossDefeated(this.type);
        }
      },

      update() {
        if (!this.active || Game.state !== 'PLAYING') return;

        this.angle = Math.atan2(Player.y - this.y, Player.x - this.x);
        this.attackTimer++;

        if (this.type === 'AGENT_X') {
          // AGENT X: Swift Rapier Lunges & Burgundy Shadow Teleports
          const dist = Math.hypot(Player.x - this.x, Player.y - this.y);
          if (dist > 90) {
            this.x += Math.cos(this.angle) * 3.8;
            this.y += Math.sin(this.angle) * 3.8;
          }

          if (this.attackTimer % 90 === 0) {
            // Rapier Lunge Combo
            Sound.slash();
            Projectiles.spawn(this.x, this.y, this.angle, 14, 25, 'SHADOW_BLADE');
          }

          if (this.attackTimer % 210 === 0) {
            // Shadow Teleport behind player
            Sound.dash();
            Particles.spawnShadowVortex(this.x, this.y);
            const ang = Player.angle + Math.PI;
            this.x = Player.x + Math.cos(ang) * 90;
            this.y = Player.y + Math.sin(ang) * 90;
            Particles.spawnShadowVortex(this.x, this.y);
          }
        } else if (this.type === 'BLUE_ZOMBIE') {
          // BLUE ZOMBIE: Telekinetic Gravity, Azure Shockwaves, Dimensional Pulses
          const dist = Math.hypot(Player.x - this.x, Player.y - this.y);
          this.x += Math.cos(this.angle) * 2.2;
          this.y += Math.sin(this.angle) * 2.2;

          // Azure Shockwave Pulse
          if (this.attackTimer % 110 === 0) {
            Sound.bossShockwave();
            Game.shake = 12;
            Particles.spawnShockwave(this.x, this.y, '#38bdf8', 220);
            if (dist < 220) {
              Player.takeDamage(26);
            }
          }

          // Telekinetic Azure Projectile Ring
          if (this.attackTimer % 180 === 0) {
            Sound.blaster();
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
              Projectiles.spawn(this.x, this.y, a, 8, 30, 'AZURE_ORB');
            }
          }

          // Gravitational Drag
          if (dist > 180 && this.attackTimer % 260 === 0) {
            Player.x += (this.x - Player.x) * 0.35;
            Player.y += (this.y - Player.y) * 0.35;
            Game.flashAlpha = 0.25;
            Game.flashColor = '#0284c7';
            Sound.bossShockwave();
          }
        }
      },

      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.type === 'BLUE_ZOMBIE') {
          // CANONICAL BLUE ZOMBIE: Human-shaped, blue skin, ordinary gray T-shirt, black pants
          // Azure telekinetic aura
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 24;
          ctx.fill();

          // Gray T-shirt torso
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#38bdf8';
          ctx.stroke();

          // Pale Blue Head / Hands
          ctx.fillStyle = '#22d3ee';
          ctx.beginPath();
          ctx.arc(8, 0, 10, 0, Math.PI * 2);
          ctx.fill();

          // Cold Cyan Glowing Eyes
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.fillRect(12, -4, 4, 3);
          ctx.fillRect(12, 2, 4, 3);
        } else if (this.type === 'AGENT_X') {
          // CANONICAL AGENT X: Pale human male, dark hair, black coat, white shirt, burgundy vest
          // Burgundy shadow aura
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(168, 85, 247, 0.2)';
          ctx.shadowColor = '#9333ea';
          ctx.shadowBlur = 18;
          ctx.fill();

          // Black coat & burgundy vest
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#881337'; // burgundy vest
          ctx.fillRect(-6, -8, 12, 16);

          // Head & slick dark hair
          ctx.fillStyle = '#ffe4e6'; // pale face
          ctx.beginPath();
          ctx.arc(8, 0, 9, 0, Math.PI * 2);
          ctx.fill();

          // Rapier Cane Blade
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(12, 8);
          ctx.lineTo(38, 12);
          ctx.stroke();
        }

        ctx.restore();
      }
    };

    /* =====================================================================
       PROJECTILES
       ===================================================================== */
    const Projectiles = {
      list: [],
      spawn(x, y, angle, speed, dmg, type) {
        this.list.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          dmg, type, life: 75, angle
        });
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const p = this.list[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          // Collisions
          if (p.type === 'BULLET' || p.type === 'HYBRID_BLASTER' || p.isPlayer) {
            // Hit Enemies
            for (let e of Enemies.list) {
              if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 8) {
                e.takeDamage(p.dmg, p.vx * 0.4, p.vy * 0.4);
                p.life = 0;
                break;
              }
            }
            // Hit Boss
            if (Boss.active && Math.hypot(Boss.x - p.x, Boss.y - p.y) < Boss.radius + 8) {
              Boss.takeDamage(p.dmg);
              p.life = 0;
            }
          } else {
            // Enemy / Boss Projectile hitting player
            if (Math.hypot(Player.x - p.x, Player.y - p.y) < Player.radius + 8) {
              Player.takeDamage(p.dmg);
              p.life = 0;
            }
          }

          if (p.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        for (let p of this.list) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);

          if (p.type === 'HYBRID_BLASTER') {
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.fillRect(-10, -3, 20, 6);
          } else if (p.type === 'AZURE_ORB') {
            ctx.fillStyle = '#06b6d4';
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'SHADOW_BLADE') {
            ctx.fillStyle = '#9333ea';
            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 12;
            ctx.fillRect(-8, -2, 16, 4);
          } else {
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-6, -2, 12, 4);
          }
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       PARTICLES & VFX
       ===================================================================== */
    const Particles = {
      list: [],
      spawnBlood(x, y, color = '#ef4444') {
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 4;
          this.list.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 25, maxLife: 25, size: 3 + Math.random() * 3, color
          });
        }
      },
      spawnCompositeSwordSlash(x, y, angle, range, isHybrid, comboStep) {
        this.list.push({
          type: 'COMPOSITE_SLASH', x, y, angle, range, isHybrid,
          comboStep, life: 12, maxLife: 12
        });
        // Segment sparks and ribbon trail
        for (let s = 1; s <= 5; s++) {
          const segDist = (range / 5) * s;
          const a = angle + (Math.random() - 0.5) * 0.4;
          this.list.push({
            x: x + Math.cos(a) * segDist,
            y: y + Math.sin(a) * segDist,
            life: 14, maxLife: 14, size: 4, color: isHybrid ? '#38bdf8' : '#fbbf24'
          });
        }
      },
      spawnSlashArc(x, y, angle, range, isHybrid, comboStep) {
        this.list.push({
          type: 'SLASH_ARC', x, y, angle, range, isHybrid,
          comboStep, life: 9, maxLife: 9
        });
      },
      spawnDashGhost(x, y, angle, isHybrid) {
        this.list.push({
          type: 'GHOST', x, y, angle, isHybrid,
          life: 14, maxLife: 14
        });
      },
      spawnShockwave(x, y, color, maxRadius) {
        this.list.push({
          type: 'WAVE', x, y, color, currentRadius: 10, maxRadius,
          life: 20, maxLife: 20
        });
      },
      spawnLightningArc(x1, y1, x2, y2) {
        const steps = 8;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const px = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 20;
          const py = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 20;
          this.list.push({
            x: px, y: py, life: 18, maxLife: 18, size: 5 + Math.random() * 4, color: '#facc15'
          });
        }
        this.list.push({
          x: x2, y: y2, life: 12, maxLife: 12, size: 14, color: '#fef08a'
        });
      },
      spawnShadowVortex(x, y) {
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * Math.PI * 2;
          this.list.push({
            x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
            life: 20, maxLife: 20, size: 4, color: '#881337'
          });
        }
      },
      update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const p = this.list[i];
          p.life--;
          if (p.vx !== undefined) {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.92; p.vy *= 0.92;
          }
          if (p.type === 'WAVE') {
            p.currentRadius += (p.maxRadius - p.currentRadius) * 0.18;
          }
          if (p.life <= 0) this.list.splice(i, 1);
        }
      },
      draw() {
        for (let p of this.list) {
          const alpha = p.life / p.maxLife;
          ctx.save();
          if (p.type === 'COMPOSITE_SLASH') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            // Draw whip segments
            ctx.strokeStyle = p.isHybrid ? `rgba(56, 189, 248, ${alpha})` : `rgba(251, 191, 36, ${alpha})`;
            ctx.shadowColor = p.isHybrid ? '#38bdf8' : '#f59e0b';
            ctx.shadowBlur = 16;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, p.range, -0.55, 0.55);
            ctx.stroke();
            // Inner serrated sharp arc
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, p.range * 0.85, -0.4, 0.4);
            ctx.stroke();
          } else if (p.type === 'SLASH_ARC') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.strokeStyle = p.isHybrid ? `rgba(56, 189, 248, ${alpha})` : `rgba(241, 245, 249, ${alpha})`;
            ctx.shadowColor = p.isHybrid ? '#38bdf8' : '#ffffff';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, p.range, -0.4, 0.4);
            ctx.stroke();
          } else if (p.type === 'GHOST') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.isHybrid ? `rgba(56, 189, 248, ${alpha * 0.3})` : `rgba(148, 163, 184, ${alpha * 0.25})`;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'WAVE') {
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.currentRadius, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }
    };

    /* =====================================================================
       INPUT HANDLER (Keyboard + Mouse + Mobile Virtual Controls)
       ===================================================================== */
    const Input = {
      keys: {},
      mouseX: window.innerWidth / 2,
      mouseY: window.innerHeight / 2,
      shiftHeld: false,
      joystick: { active: false, x: 0, y: 0, startX: 0, startY: 0 },

      init() {
        window.addEventListener('keydown', e => {
          this.keys[e.key] = true;
          this.shiftHeld = e.shiftKey;

          if (Game.state === 'STORY') {
            if (e.key === ' ' || e.key === 'Enter') { Game.advanceDialogue(); e.preventDefault(); }
            return;
          }

          // Gameplay controls
          if (e.key === 'Enter') Player.attack();
          if (e.key === ' ') { Player.dash(); e.preventDefault(); }
          if (e.key === 'e' || e.key === 'E') Player.spinBreaker();
          if (e.key === 'q' || e.key === 'Q') Player.cycleWeapon();
          if (e.key === 'f' || e.key === 'F') Player.fireGun();
          if (e.key === 'r' || e.key === 'R') Player.voidPulse();
          if (e.key === 't' || e.key === 'T') Player.azureOverdrive();
          if (e.key === 'g' || e.key === 'G') Player.chainLightning();
          if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') UI.toggleMenu();
        });

        window.addEventListener('keyup', e => {
          this.keys[e.key] = false;
          this.shiftHeld = e.shiftKey;
        });

        window.addEventListener('mousemove', e => {
          this.mouseX = e.clientX;
          this.mouseY = e.clientY;
        });

        window.addEventListener('mousedown', e => {
          Sound.init();
          if (Game.state === 'STORY') { Game.advanceDialogue(); return; }
          if (e.button === 0) Player.cycleWeapon();
          if (e.button === 2) Player.fireGun();
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // Setup Touch Controls for Mobile
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          document.getElementById('mobile-controls').style.display = 'block';
          this.setupTouch();
        }
      },

      setupTouch() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');

        zone.addEventListener('touchstart', e => {
          const t = e.touches[0];
          const rect = zone.getBoundingClientRect();
          this.joystick.startX = rect.left + rect.width / 2;
          this.joystick.startY = rect.top + rect.height / 2;
          this.joystick.active = true;
          this.handleJoystickMove(t.clientX, t.clientY, knob);
        });

        zone.addEventListener('touchmove', e => {
          if (!this.joystick.active) return;
          const t = e.touches[0];
          this.handleJoystickMove(t.clientX, t.clientY, knob);
        });

        const resetJoy = () => {
          this.joystick.active = false;
          this.joystick.x = 0;
          this.joystick.y = 0;
          knob.style.transform = `translate(-50%, -50%)`;
        };
        zone.addEventListener('touchend', resetJoy);
        zone.addEventListener('touchcancel', resetJoy);

        document.getElementById('btn-slash').addEventListener('touchstart', e => { e.preventDefault(); Player.attack(); });
        document.getElementById('btn-shoot').addEventListener('touchstart', e => { e.preventDefault(); Player.fireGun(); });
        document.getElementById('btn-dash').addEventListener('touchstart', e => { e.preventDefault(); Player.dash(); });
        document.getElementById('btn-spin').addEventListener('touchstart', e => { e.preventDefault(); Player.spinBreaker(); });
        document.getElementById('btn-cycle').addEventListener('touchstart', e => { e.preventDefault(); Player.cycleWeapon(); });
      },

      handleJoystickMove(cx, cy, knob) {
        let dx = cx - this.joystick.startX;
        let dy = cy - this.joystick.startY;
        const maxDist = 45;
        const dist = Math.hypot(dx, dy);
        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        this.joystick.x = dx / maxDist;
        this.joystick.y = dy / maxDist;
      }
    };

    /* =====================================================================
       UI & MODALS
       ===================================================================== */
    const UI = {
      init() {
        // Build Codex Content
        const codexGrid = document.getElementById('codex-content');
        codexGrid.innerHTML = CODEX_DATA.map(item => `
          <div class="codex-card ${item.class}">
            <div class="codex-tag">${item.tag}</div>
            <div class="codex-name">${item.name}</div>
            <div class="codex-desc">${item.desc}</div>
          </div>
        `).join('');

        document.getElementById('btn-codex').onclick = () => {
          document.getElementById('codex-modal').style.display = 'flex';
        };
        document.getElementById('btn-close-codex').onclick = () => {
          document.getElementById('codex-modal').style.display = 'none';
        };
        document.getElementById('btn-pause').onclick = () => {
          this.toggleMenu();
        };

        document.getElementById('m-btn-resume').onclick = () => this.toggleMenu();
        document.getElementById('m-btn-stage1').onclick = () => { this.toggleMenu(); Game.loadChapter(1); };
        document.getElementById('m-btn-stage2').onclick = () => { this.toggleMenu(); Game.loadChapter(2); };
        document.getElementById('m-btn-stage3').onclick = () => { this.toggleMenu(); Game.loadChapter(3); };
        document.getElementById('m-btn-stage4').onclick = () => { this.toggleMenu(); Game.loadChapter(4); };

        const soundBtn = document.getElementById('m-btn-sound');
        soundBtn.onclick = () => {
          Sound.enabled = !Sound.enabled;
          soundBtn.innerText = Sound.enabled ? "AUDIO: SYNTHESIZER SOUND ON" : "AUDIO: MUTED";
        };
      },

      toggleMenu() {
        const modal = document.getElementById('menu-modal');
        const isShown = modal.style.display === 'flex';
        modal.style.display = isShown ? 'none' : 'flex';
        Game.isPaused = !isShown;
      }
    };

    /* =====================================================================
       MAIN GAME LOOP
       ===================================================================== */
    function loop() {
      // Screen Shake offset
      let shakeX = 0, shakeY = 0;
      if (Game.shake > 0) {
        shakeX = (Math.random() - 0.5) * Game.shake;
        shakeY = (Math.random() - 0.5) * Game.shake;
        Game.shake *= 0.88;
        if (Game.shake < 0.3) Game.shake = 0;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);

      // Background Grid / Post-apocalyptic Arena
      ctx.fillStyle = '#090e15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Floor Grid
      ctx.strokeStyle = '#121d2b';
      ctx.lineWidth = 1;
      const gridSize = 48;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Update & Draw Game Entities
      if (!Game.isPaused) {
        Player.update();
        Enemies.update();
        Boss.update();
        Projectiles.update();
        Pickups.update();
        Particles.update();
      }

      Particles.draw();
      Enemies.draw();
      Pickups.draw();
      Boss.draw();
      Player.draw();
      Projectiles.draw();

      ctx.restore();

      // Screen Flash overlay
      if (Game.flashAlpha > 0) {
        ctx.fillStyle = Game.flashColor;
        ctx.globalAlpha = Game.flashAlpha;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        Game.flashAlpha -= 0.03;
      }

      requestAnimationFrame(loop);
    }

    window.onload = () => Game.init();
  </script>
</body>
</html>
